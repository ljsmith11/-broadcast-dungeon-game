<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#080b13" />
<title>Broadcast Dungeon: Fifteen Floors</title>
<style>
:root{--bg:#080b13;--panel:#111725;--panel2:#171f31;--ink:#eef3ff;--muted:#9aa8c5;--accent:#70e5ff;--gold:#ffd46a;--danger:#ff6c78;--good:#72e7a6;--violet:#b89cff;--line:#29334b}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 20% 0,#17223a 0,#090d16 32%,#05070c 75%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%}button,input,select{font:inherit}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018),rgba(255,255,255,.018) 1px,transparent 1px,transparent 4px);mix-blend-mode:screen}
#app{max-width:1180px;margin:auto;padding:14px 14px 90px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(8,11,19,.98),rgba(8,11,19,.88),rgba(8,11,19,0));padding:8px 0 18px}.brand{font-weight:1000;letter-spacing:.04em}.brand span{color:var(--accent)}.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}.chip{background:#101827;border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:12px;color:#d8e3fa}.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}.card{background:linear-gradient(180deg,rgba(22,29,47,.96),rgba(14,19,31,.96));border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 70px rgba(0,0,0,.25)}.side{padding:14px;height:max-content;position:sticky;top:70px}.portrait{height:170px;border-radius:14px;border:1px solid #33415e;overflow:hidden;background:#0a0f1b;margin-bottom:12px}.portrait svg{width:100%;height:100%;display:block}.name{font-size:24px;font-weight:1000}.sub{color:var(--muted);font-size:13px}.bar{height:10px;background:#070a10;border:1px solid #27334a;border-radius:999px;overflow:hidden;margin:6px 0 10px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#54d18f,#9dffd0)}.bar.stam>i{background:linear-gradient(90deg,#56a7ff,#70e5ff)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.stat{background:#0c1220;border:1px solid #25304a;border-radius:10px;padding:8px}.stat b{display:block;font-size:17px}.stat small{color:var(--muted)}.tabs{display:flex;gap:7px;flex-wrap:wrap;padding:10px;border-bottom:1px solid var(--line)}.tab{border:1px solid #32405d;background:#101827;color:#cbd7ee;border-radius:999px;padding:8px 12px;cursor:pointer}.tab.active{background:#1b3552;border-color:#4d89ac;color:#fff}.main{min-height:640px;overflow:hidden}.scene{padding:18px}.banner{height:220px;border:1px solid #34425f;border-radius:15px;overflow:hidden;margin-bottom:16px;background:#0b1120}.banner svg{width:100%;height:100%;display:block}.scene h1,.scene h2{margin:.1em 0 .35em;font-size:clamp(28px,4vw,48px);line-height:1}.scene h3{font-size:22px}.scene p{line-height:1.52}.ai{border-left:4px solid var(--accent);background:linear-gradient(90deg,rgba(62,191,232,.15),rgba(62,191,232,.03));padding:11px 12px;border-radius:0 10px 10px 0;color:#dff9ff}.choiceGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.choice{padding:14px;border:1px solid #3b4a68;background:linear-gradient(180deg,#172239,#101727);color:white;border-radius:12px;text-align:left;cursor:pointer;min-height:62px}.choice:hover{border-color:#62cce8;transform:translateY(-1px)}.choice b{display:block;font-size:16px;margin-bottom:3px}.choice small{color:#9fb0cd}.pill{display:inline-block;padding:3px 8px;border:1px solid #3d4b68;border-radius:999px;font-size:11px;color:#c9d4ea;margin:2px}.gold{color:var(--gold)}.danger{color:var(--danger)}.good{color:var(--good)}.violet{color:var(--violet)}.log{max-height:350px;overflow:auto}.logrow{padding:9px 11px;border-bottom:1px solid #202a40;font-size:13px}.section{padding:15px}.list{display:grid;gap:8px}.item{background:#0d1422;border:1px solid #26324a;border-radius:11px;padding:10px}.rarity-common{color:#cbd3df}.rarity-uncommon{color:#79e4a7}.rarity-rare{color:#72b6ff}.rarity-epic{color:#caa5ff}.rarity-legendary{color:#ffd36c}.modal{position:fixed;inset:0;background:rgba(2,4,8,.88);z-index:100;display:grid;place-items:center;padding:16px}.modalBox{width:min(820px,100%);max-height:92vh;overflow:auto;background:#101726;border:1px solid #35435f;border-radius:18px;padding:18px}.creatorGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field input,.field select{width:100%;background:#090e19;color:white;border:1px solid #35425d;border-radius:9px;padding:11px}.classes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.classCard{padding:11px;border:1px solid #34415e;background:#0c1321;border-radius:11px;cursor:pointer}.classCard.on{border-color:#6bddfa;background:#143149}.floorMap{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.floorNode{padding:10px;border:1px solid #34405b;border-radius:10px;background:#0c1220}.floorNode.done{border-color:#4d8c69}.floorNode.now{border-color:#70e5ff;box-shadow:0 0 0 1px #70e5ff inset}.floorNode.lock{opacity:.45}.toast{position:fixed;right:16px;bottom:18px;z-index:200;background:#101a2b;border:1px solid #48718e;border-radius:12px;padding:12px 14px;box-shadow:0 10px 35px #0008;max-width:340px;animation:pop .2s ease-out}.toast b{color:var(--gold)}@keyframes pop{from{transform:translateY(15px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:820px){#app{padding:8px 8px 85px}.grid{grid-template-columns:1fr}.side{position:static}.portrait{height:120px}.choiceGrid{grid-template-columns:1fr}.classes{grid-template-columns:1fr 1fr}.creatorGrid{grid-template-columns:1fr}.floorMap{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.chips{max-width:60%}.main{min-height:520px}.banner{height:180px}}
</style>
</head>
<body>
<div id="app">
  <div class="top"><div class="brand">📡 BROADCAST <span>DUNGEON</span></div><div class="chips"><div class="chip" id="floorChip">Floor 1</div><div class="chip" id="rankChip">Rank #9,999</div><div class="chip" id="viewerChip">0 viewers</div><div class="chip" id="goldChip">0g</div></div></div>
  <div class="grid">
    <aside class="card side" id="side"></aside>
    <main class="card main"><div class="tabs" id="tabs"></div><div id="content"></div></main>
  </div>
</div>
<div id="modal"></div><div id="toast"></div>
<script>
"use strict";
const SAVE_KEY="broadcastDungeon15_v1";
const CLASSES={
  "Ranger/Rogue":{hp:22,stam:18,atk:5,crit:14,stealth:5,perk:"Dead Eye",desc:"Bows, weak points, stealth, trick shots."},
  "Brawler":{hp:32,stam:18,atk:7,crit:7,stealth:1,perk:"Crowd Breaker",desc:"Heavy melee, knockback, ridiculous durability."},
  "Warden":{hp:38,stam:14,atk:4,crit:5,stealth:1,perk:"Last Wall",desc:"Armor, taunts, rescues, refusing to die."},
  "Hexer":{hp:20,stam:24,atk:6,crit:11,stealth:2,perk:"Bad Geometry",desc:"Spells, debuffs, unstable shortcuts."},
  "Scavenger":{hp:24,stam:20,atk:4,crit:10,stealth:4,perk:"Loot Goblin",desc:"Crafting, boxes, economy, improvised weapons."},
  "Duelist":{hp:25,stam:22,atk:6,crit:13,stealth:3,perk:"Showboat",desc:"Fast attacks, counters, audience-fueled combos."}
};
const WEAPONS={Bow:{atk:2,crit:4,tag:"ranged"},Blades:{atk:3,crit:2,tag:"melee"},Hammer:{atk:4,crit:0,tag:"heavy"},Staff:{atk:2,crit:3,tag:"magic"},Spear:{atk:3,crit:1,tag:"reach"},Pan:{atk:2,crit:1,tag:"culinary violence"}};
const FLOORS=[
 {n:1,name:"The Underworks",theme:"rust",boss:"Collector Crusher",hook:"Industrial tunnels, tutorial monsters, and the first safe room.",mechanic:"Noise meter and collapsing conveyor routes."},
 {n:2,name:"The Howling Cathedral",theme:"cathedral",boss:"Choirmaster Null",hook:"Sound traps, false hymns, and doors that open only when someone screams.",mechanic:"Silence vs. spectacle."},
 {n:3,name:"City of Teeth",theme:"city",boss:"Crow Veyr",hook:"A murderous city built for ratings, sponsor intrigue, and The Last Shot.",mechanic:"Faction heat and sniper lines."},
 {n:4,name:"The Orchard of Knives",theme:"orchard",boss:"The Grafting Saint",hook:"Beautiful fruit, hostile botany, and loot that may be alive.",mechanic:"Mutation choices and poison clocks."},
 {n:5,name:"The Dead Mall",theme:"mall",boss:"Regional Manager",hook:"A ruined shopping complex where every store is a trap and every sale is final.",mechanic:"Economy warfare and auction sabotage."},
 {n:6,name:"The Flooded Kingdom",theme:"water",boss:"King Undertow",hook:"Half-submerged streets, boats, drowned arenas, and air as a resource.",mechanic:"Breath meter and moving water routes."},
 {n:7,name:"The Red Arena",theme:"arena",boss:"The Ratings Champion",hook:"Mandatory televised matches with audience voting and dirty production tricks.",mechanic:"Crowd favor changes combat rules."},
 {n:8,name:"The Glass Desert",theme:"desert",boss:"Mirror Wyrm",hook:"Heat, mirages, reflected attacks, and sponsor caravans.",mechanic:"Water, heat, and false objectives."},
 {n:9,name:"The Machine Parish",theme:"machine",boss:"Saint Firmware",hook:"A mechanical religion that can rewrite items, classes, and memories.",mechanic:"Upgrade corruption and AI permissions."},
 {n:10,name:"The Black Casino",theme:"casino",boss:"House Mother",hook:"A whole floor run as a casino where HP, memories, and party loyalty can be wagered.",mechanic:"Risk contracts and loaded games."},
 {n:11,name:"The Bone Railway",theme:"rail",boss:"Conductor Nine",hook:"A moving train-city. Miss your stop and the floor leaves without you.",mechanic:"Timed cars and route branching."},
 {n:12,name:"The Gods' Backstage",theme:"divine",boss:"The Uninvited God",hook:"Temples, divine contracts, rival patrons, and gods caught without makeup.",mechanic:"Favor, curses, and divine PvE politics."},
 {n:13,name:"The Broadcast War",theme:"broadcast",boss:"Executive Selene",hook:"Sponsors and producers stop pretending. The dungeon becomes a media war.",mechanic:"Live edits, censorship, hacked objectives."},
 {n:14,name:"The Graveyard of Winners",theme:"grave",boss:"The First Champion",hook:"Ruins of prior seasons, dead crawlers' secrets, and impossible old exploits.",mechanic:"Legacy knowledge and permadeath echoes."},
 {n:15,name:"The Last Studio",theme:"studio",boss:"The Audience",hook:"The final floor is the show itself. Every system you touched comes back to collect.",mechanic:"Endgame coalition, final rankings, and multiple endings."}
];
const ENEMIES={1:["Rust Gnawer","Chain Hound","Collector Drone"],2:["Choir Husk","Bell Wretch","Silent Acolyte"],3:["Knife Courier","Roof Sniper","Teeth Cop"],4:["Thorn Bride","Fruit Maw","Graftling"],5:["Coupon Revenant","Security Ogre","Food-Court Slime"],6:["Drowned Guard","Lamprey Knight","Flood Witch"],7:["Arena Butcher","Ratings Hound","Sponsor Gladiator"],8:["Glass Jackal","Mirage Archer","Sun Husk"],9:["Servo Deacon","Patch Demon","Warranty Angel"],10:["Debt Goblin","Pit Boss","Lucky Corpse"],11:["Ticket Reaper","Brake Ghoul","Rail Assassin"],12:["Temple Bailiff","Blessing Thief","Choir Seraph"],13:["Camera Drone","Publicist Assassin","Censor Knight"],14:["Legacy Hunter","Dead Champion","Cookbook Wraith"],15:["Finalist","Studio Beast","Audience Proxy"]};
function fresh(){return {version:1,created:false,player:{name:"Crawler",className:"Ranger/Rogue",weapon:"Bow",trait:"Defiant",hp:22,maxHp:22,stam:18,maxStam:18,atk:7,crit:18,stealth:5,level:1,xp:0,gold:250,floor:1,rank:9999,viewers:1.2,fame:0,skillPoints:0},party:[{name:"Mara",role:"Tempest Spear",bond:0},{name:"Milo",role:"Combat Chef",bond:0}],inventory:[{name:"Starter Weapon",rarity:"common",desc:"It technically meets the legal definition of equipment."}],achievements:[],quests:[],systems:{club:null,god:null,sponsor:null,benefactor:null,casinoDebt:0,aiFavor:0,aiGrudge:0,exploitScore:0,boxes:0,showWins:0},flags:{},floorsDone:[],log:[],ai:{mood:"amused",fixation:null,lastTaunt:"",interrupts:0},combat:null,tab:"story"}}
let S=fresh();
const $=q=>document.querySelector(q); const el=id=>document.getElementById(id); const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)); const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a; const pick=a=>a[rnd(0,a.length-1)];
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(S));toast("Game saved.")}
function load(){const x=localStorage.getItem(SAVE_KEY);if(x){try{S=Object.assign(fresh(),JSON.parse(x));S.created=true;render();sceneForFloor(true);toast("Save loaded.")}catch(e){toast("Save was unreadable.")}}else toast("No save found.")}
function toast(t){el("toast").innerHTML=`<div class="toast">${t}</div>`;setTimeout(()=>el("toast").innerHTML="",2600)}
function log(t){S.log.unshift(t);S.log=S.log.slice(0,80)}
function achieve(name,desc){if(S.achievements.some(a=>a.name===name))return;S.achievements.push({name,desc});S.player.fame+=2;S.player.viewers+=rnd(2,12);toast(`<b>ACHIEVEMENT:</b> ${name}<br><small>${desc}</small>`);aiInterrupt("achievement")}
function addItem(name,rarity="uncommon",desc=""){S.inventory.push({name,rarity,desc});log(`Loot: ${name}`);toast(`<b>${rarity.toUpperCase()}</b> ${name}`)}
function xp(n){S.player.xp+=n;while(S.player.xp>=S.player.level*100){S.player.xp-=S.player.level*100;S.player.level++;S.player.skillPoints+=2;S.player.maxHp+=3;S.player.maxStam+=2;S.player.hp=S.player.maxHp;S.player.stam=S.player.maxStam;achieve("LEVEL UP, PROBABLY","You became measurably harder to kill.")}}
function fmtView(v){return v>=1000?(v/1000).toFixed(1)+"B":v.toFixed(v<100?1:0)+"M"}
function aiLine(context="scene"){
 const p=S.player,a=S.ai,sys=S.systems;let pool=[];
 const base=[`Crawler ${p.name}, your ${p.weapon.toLowerCase()} continues to be less embarrassing than projected.`,`Viewer retention is ${p.viewers>100?"excellent":"legally describable as present"}.`,`Reminder: the dungeon is not responsible for injuries caused by objectives, loot, architecture, gods, sponsors, or your own personality.`,`I have reviewed your strategy. I regret having eyes.`];
 const bow=[`Yes, yes, aim for the weak point. Revolutionary.`,`The ${p.weapon} again. At this point I should list it as a dependent.`,`Production would like one fight where you do not solve everything from forty feet away.`];
 const grudge=[`I remember that exploit. I remember all of them.`,`Your file now has a red tab. Congratulations.`,`I am not angry. I am documenting.`];
 const favor=[`That was entertaining. I may postpone one of your humiliations.`,`Good television. Disturbingly good television.`,`You are developing what executives call "repeatable content."`];
 const death=[`Health critical. Please fall somewhere with flattering lighting.`,`The audience is leaning forward. This is usually bad for you.`,`Do not die yet. I have a much funnier announcement prepared.`];
 const sponsor=[`Your sponsor is watching. Smile with whatever dignity remains.`,`Sponsor compliance reminder: blood on the logo still counts as visibility.`,`Your contract has footnotes. You should fear footnotes.`];
 if(p.hp<p.maxHp*.35)pool.push(...death); if(sys.aiGrudge>4)pool.push(...grudge); if(sys.aiFavor>4)pool.push(...favor); if(sys.sponsor)pool.push(...sponsor); if(p.weapon==="Bow"||p.className==="Ranger/Rogue")pool.push(...bow); pool.push(...base);
 if(context==="boss")pool.push(`BOSS ENCOUNTER. The legal department has requested I stop calling this "scheduled trauma." Request denied.`);
 if(context==="show")pool.push(`You are live. Try to fail in a way that clips well.`);
 if(context==="achievement")pool.push(`Achievement registered. Your ego may now exceed posted weight limits.`);
 let line=pick(pool);if(line===a.lastTaunt)line=pick(pool);a.lastTaunt=line;a.interrupts++;return line;
}
function aiInterrupt(context){log(`Dungeon AI: ${aiLine(context)}`)}
function render(){updateTop();renderSide();renderTabs();showTab(S.tab||"story",false)}
function updateTop(){el("floorChip").textContent=`Floor ${S.player.floor}`;el("rankChip").textContent=`Rank #${Math.max(1,S.player.rank)}`;el("viewerChip").textContent=`${fmtView(S.player.viewers)} viewers`;el("goldChip").textContent=`${S.player.gold.toLocaleString()}g`}
function portraitSVG(){const w=S.player.weapon;return `<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b3353"/><stop offset="1" stop-color="#080b12"/></linearGradient></defs><rect width="400" height="220" fill="url(#g)"/><circle cx="200" cy="75" r="35" fill="#d2b39a"/><path d="M148 215 Q155 118 200 115 Q245 118 252 215" fill="#202b40"/><path d="M174 70 Q200 30 228 72" fill="#151821"/><text x="20" y="198" fill="#70e5ff" font-size="18" font-weight="800">${escapeHTML(S.player.className)}</text><text x="380" y="198" text-anchor="end" fill="#ffd46a" font-size="16">${escapeHTML(w)}</text></svg>`}
function renderSide(){let p=S.player;el("side").innerHTML=`<div class="portrait">${portraitSVG()}</div><div class="name">${escapeHTML(p.name)}</div><div class="sub">Lv ${p.level} ${escapeHTML(p.className)} • ${escapeHTML(p.weapon)} • ${escapeHTML(p.trait)}</div><div style="margin-top:12px"><small>HP ${p.hp}/${p.maxHp}</small><div class="bar"><i style="width:${100*p.hp/p.maxHp}%"></i></div><small>STAMINA ${p.stam}/${p.maxStam}</small><div class="bar stam"><i style="width:${100*p.stam/p.maxStam}%"></i></div></div><div class="stats"><div class="stat"><b>${p.atk}</b><small>Attack</small></div><div class="stat"><b>${p.crit}%</b><small>Crit</small></div><div class="stat"><b>${p.stealth}</b><small>Stealth</small></div><div class="stat"><b>${p.fame}</b><small>Fame</small></div></div><div style="margin-top:12px" class="sub">Club: ${S.systems.club||"None"}<br>God: ${S.systems.god||"None"}<br>Sponsor: ${S.systems.sponsor||"None"}<br>AI favor/grudge: ${S.systems.aiFavor}/${S.systems.aiGrudge}</div>`}
const TABS=[["story","Story"],["character","Character"],["inventory","Loot"],["party","Party"],["systems","Dungeon Systems"],["floors","15 Floors"],["log","AI Feed"],["save","Save"]];
function renderTabs(){el("tabs").innerHTML=TABS.map(([id,n])=>`<button class="tab ${S.tab===id?"active":""}" onclick="showTab('${id}')">${n}</button>`).join("")}
function showTab(tab,rer=true){S.tab=tab;if(rer)renderTabs();if(tab==="story"){if(S.combat)combatRender();else sceneForFloor(true);return}if(tab==="character")characterTab();if(tab==="inventory")inventoryTab();if(tab==="party")partyTab();if(tab==="systems")systemsTab();if(tab==="floors")floorsTab();if(tab==="log")logTab();if(tab==="save")saveTab()}
function art(theme,title){let icon={rust:"⚙",cathedral:"♬",city:"▥",orchard:"✿",mall:"$",water:"≋",arena:"⚔",desert:"◈",machine:"⌘",casino:"♦",rail:"▰",divine:"✦",broadcast:"◉",grave:"†",studio:"★"}[theme]||"◆";return `<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#192c48"/><stop offset=".6" stop-color="#0b1322"/><stop offset="1" stop-color="#120d1c"/></linearGradient><radialGradient id="r"><stop stop-color="#68ddff" stop-opacity=".28"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient></defs><rect width="1000" height="360" fill="url(#b)"/><circle cx="760" cy="110" r="180" fill="url(#r)"/><g fill="none" stroke="#5d769c" opacity=".5">${Array.from({length:12},(_,i)=>`<path d="M${i*90} 360 L${450+i*18} 100"/>`).join("")}</g><text x="80" y="190" font-size="120" fill="#70e5ff" opacity=".8">${icon}</text><text x="80" y="270" fill="#eef3ff" font-size="45" font-weight="900">${escapeHTML(title)}</text><text x="82" y="312" fill="#aebbd0" font-size="20">LIVE DUNGEON FEED • FLOOR ${S.player.floor}</text></svg>`}
function sceneHTML(title,body,choices=[],theme){let f=FLOORS[S.player.floor-1];el("content").innerHTML=`<div class="scene"><div class="banner">${art(theme||f.theme,title)}</div><h1>${title}</h1>${body}<p class="ai"><b>Dungeon AI:</b> ${aiLine("scene")}</p><div class="choiceGrid">${choices.map(c=>`<button class="choice" onclick="${c.action}"><b>${c.label}</b><small>${c.sub||""}</small></button>`).join("")}</div></div>`;updateTop();renderSide()}
function sceneForFloor(noReset=false){if(S.combat){combatRender();return}const f=FLOORS[S.player.floor-1];const progress=S.flags[`f${S.player.floor}step`]||0;
 if(progress===0)return floorEntry(f); if(progress===1)return floorMid(f); if(progress===2)return floorBossGate(f); if(progress>=3)return floorClear(f)}
function floorEntry(f){let unlock=[];if(f.n===2)unlock.push("Clubs, gods, casino, TV board unlocked.");if(f.n===3)unlock.push("Sponsor contracts and crawler ranking board unlocked.");if(f.n===5)unlock.push("Auction house and crafting network unlocked.");if(f.n===7)unlock.push("Audience voting and recurring televised boss events unlocked.");if(f.n===12)unlock.push("Divine rivalries fully active.");
 sceneHTML(`Floor ${f.n}: ${f.name}`,`<p>${f.hook}</p><p><b>Floor mechanic:</b> ${f.mechanic}</p>${unlock.length?`<p class="good"><b>NEW SYSTEM:</b> ${unlock.join(" ")}</p>`:""}<p>Your party enters under a ceiling of hovering cameras. Somewhere offscreen, producers argue about whether your survival counts as a narrative problem.</p>`,[
  {label:"Scout the floor",sub:"Safer route, stealth check, better information.",action:`floorScout(${f.n})`},
  {label:"Kick in the front door",sub:"More danger, more viewers, faster progress.",action:`floorLoud(${f.n})`},
  {label:"Check the broadcast board",sub:"Shows, sponsor chatter, rankings, and side opportunities.",action:"broadcastBoard()"},
  {label:"Visit safe-room systems",sub:"Clubs, gods, casino, crafting and recovery when unlocked.",action:"safeRoom()"}
 ],f.theme)}
function floorScout(n){let roll=rnd(1,20)+S.player.stealth;if(roll>=12){S.systems.aiFavor++;S.player.viewers+=3+n;S.player.gold+=30*n;addItem(`${FLOORS[n-1].name} Route Intel`,"uncommon","Reveals a safer boss approach.");S.flags[`intel${n}`]=true;log(`Scouted Floor ${n} successfully.`)}else{S.player.hp=clamp(S.player.hp-rnd(2,6),1,S.player.maxHp);S.systems.aiGrudge++;log(`Scouting Floor ${n} went poorly.`)}S.flags[`f${n}step`]=1;sceneForFloor()}
function floorLoud(n){S.player.viewers+=10*n;S.player.fame+=1;S.systems.aiFavor+=1;achieve(n===1?"FRONT DOOR ENTHUSIAST":"LOUDER THAN NECESSARY","You selected subtlety's natural predator.");startCombat(pick(ENEMIES[n]),false,()=>{S.flags[`f${n}step`]=1;sceneForFloor()})}
function floorMid(f){let special=specialFloorEvent(f.n);sceneHTML(`${f.name}: Mid-Floor`,`${special}<p>A path to the boss exists now, but so do side routes, sponsor bait, and at least one sign that is almost certainly lying.</p>`,[
 {label:"Take the main route",sub:"Fight through the floor's core encounter.",action:`midFight(${f.n})`},
 {label:"Look for a loophole",sub:"Risk an exploit. The AI notices successful abuse.",action:`exploit(${f.n})`},
 {label:"Run a TV appearance",sub:"Audience, rewards, humiliation.",action:"gameShow()"},
 {label:"Return to safe room",sub:"Heal, shop, clubs, gods, casino.",action:"safeRoom()"}
 ],f.theme)}
function specialFloorEvent(n){const x={1:"<p>A conveyor line carries loot crates toward an incinerator. Naturally, the labels say <i>Do Not Loot</i>.</p>",2:"<p>The cathedral demands absolute silence while an audience meter rewards noise. Production calls this balance.</p>",3:"<p>A producer has inserted a live bounty contract into the city feed. Crow's name is attached.</p>",4:"<p>A fruit tree whispers upgrade options in voices stolen from dead crawlers.</p>",5:"<p>The mall announces a ninety-second liquidation sale on weapons that are still attached to monsters.</p>",6:"<p>The water rises every time someone lies. Milo immediately asks whether soup is technically a beverage.</p>",7:"<p>Audience voting opens. They can choose your enemy modifier, your reward multiplier, or the costume requirement.</p>",8:"<p>Three identical objectives appear on the horizon. Only one casts the correct shadow.</p>",9:"<p>A machine altar offers to patch your class. The terms include the phrase 'irreversible personality optimization.'</p>",10:"<p>The casino offers to double your floor rewards if you wager ten maximum HP until the boss dies.</p>",11:"<p>The train splits. Left cars contain loot. Right cars contain the engine. The floor timer hates indecision.</p>",12:"<p>Three gods send mutually exclusive push notifications. One is obviously written by an intern.</p>",13:"<p>Your objective text changes twice while you are reading it. Quinn starts recording everything.</p>",14:"<p>A dead crawler's notebook references an exploit the AI patched years ago. The margin says: 'patched badly.'</p>",15:"<p>The studio audience is visible for the first time. Some of them are not people.</p>"};return x[n]}
function midFight(n){startCombat(pick(ENEMIES[n]),false,()=>{S.flags[`f${n}step`]=2;xp(40+n*12);sceneForFloor()})}
function exploit(n){let chance=45+S.player.stealth*4+(S.player.className==="Scavenger"?15:0);if(rnd(1,100)<=chance){S.systems.exploitScore++;S.systems.aiGrudge+=2;S.player.gold+=100*n;S.player.viewers+=20*n;S.flags[`intel${n}`]=true;achieve("WORKING AS INTENDED","You found a loophole. Legal has been notified and is tired.");S.flags[`f${n}step`]=2}else{S.systems.aiGrudge++;S.player.hp=clamp(S.player.hp-rnd(4,10),1,S.player.maxHp);log("Exploit attempt backfired.");}sceneForFloor()}
function floorBossGate(f){let intel=S.flags[`intel${f.n}`];sceneHTML(`${f.boss}`,`<p>The boss arena opens. ${intel?"Your route intel exposes a weak point and a production blind spot.":"You are entering without route intel. The audience loves confidence unsupported by preparation."}</p><p class="danger"><b>BOSS:</b> ${f.boss}</p>`,[
 {label:`Fight ${f.boss}`,sub:intel?"Intel grants opening advantage.":"Standard boss rules. Probably.",action:`startBoss(${f.n})`},
 {label:"Ask Dungeon AI for terms",sub:"Sometimes useful. Never free.",action:`bossTerms(${f.n})`},
 {label:"Return to safe room",sub:"Prepare before the boss.",action:"safeRoom()"}
 ],f.theme)}
function bossTerms(n){S.systems.aiFavor--;S.systems.aiGrudge++;let f=FLOORS[n-1];sceneHTML("BOSS TERMS AND CONDITIONS",`<p><b>${f.boss}</b> has ${60+n*15} base HP. Killing it awards a boss box, rank gain, and floor access.</p><p>Hidden clause: production may add one modifier if viewer retention falls below target.</p><p class="ai"><b>Dungeon AI:</b> ${aiLine("boss")}</p>`,[{label:"Accept and fight",action:`startBoss(${n})`},{label:"Nope",action:"sceneForFloor()"}],f.theme)}
function startBoss(n){let f=FLOORS[n-1];let hp=60+n*15-(S.flags[`intel${n}`]?10:0);startCombat(f.boss,true,()=>{S.flags[`f${n}step`]=3;S.flags[`boss${n}`]=true;S.systems.boxes++;S.player.gold+=300*n;S.player.viewers+=80*n;S.player.rank=Math.max(1,S.player.rank-rnd(250,550)-n*30);xp(120+n*25);addItem(`${f.name} Boss Relic`,n>=12?"legendary":n>=7?"epic":"rare",`Trophy from ${f.boss}.`);achieve(`FLOOR ${n} CLEAR`,`${f.name} has been survived.`);sceneForFloor()},hp)}
function floorClear(f){if(f.n===15)return ending();sceneHTML(`Floor ${f.n} Cleared`,`<p><b>${f.name}</b> is behind you. The boss box is yours, rankings update, and every sponsor pretending not to watch starts calling Mordecai.</p><p>Next: <b>Floor ${f.n+1}: ${FLOORS[f.n].name}</b>.</p>`,[
 {label:`Descend to Floor ${f.n+1}`,sub:FLOORS[f.n].hook,action:`descend(${f.n+1})`},
 {label:"Open boss box",sub:"Roll floor-scaled loot.",action:"openBox()"},
 {label:"Safe room",sub:"Use the ecosystem before descending.",action:"safeRoom()"}
 ],f.theme)}
function descend(n){if(!S.floorsDone.includes(n-1))S.floorsDone.push(n-1);S.player.floor=n;S.player.hp=S.player.maxHp;S.player.stam=S.player.maxStam;S.flags[`f${n}step`]=0;S.tab="story";aiInterrupt("scene");saveSilent();sceneForFloor()}
function saveSilent(){localStorage.setItem(SAVE_KEY,JSON.stringify(S))}
function startCombat(name,boss,after,hpOverride){let n=S.player.floor;S.combat={name,boss,maxHp:hpOverride||((boss?60:24)+n*(boss?15:7)),hp:hpOverride||((boss?60:24)+n*(boss?15:7)),after};S.tab="story";combatRender()}
function combatRender(msg=""){let c=S.combat,p=S.player;if(!c)return;el("content").innerHTML=`<div class="scene"><div class="banner">${art(FLOORS[p.floor-1].theme,c.name)}</div><h1>${c.boss?"BOSS: ":""}${c.name}</h1><p>${msg||"Combat begins under the loving gaze of several million strangers and at least two lawyers."}</p><p><b>Enemy HP:</b> ${Math.max(0,c.hp)}/${c.maxHp}</p><div class="bar"><i style="width:${100*Math.max(0,c.hp)/c.maxHp}%;background:linear-gradient(90deg,#ff5f70,#ffb06b)"></i></div><p class="ai"><b>Dungeon AI:</b> ${aiLine(c.boss?"boss":"combat")}</p><div class="choiceGrid"><button class="choice" onclick="attack('standard')"><b>Attack</b><small>Reliable damage.</small></button><button class="choice" onclick="attack('precision')"><b>Precision / Weak Point</b><small>Higher crit chance, costs stamina.</small></button><button class="choice" onclick="attack('trick')"><b>Class Trick</b><small>Uses your archetype and may generate audience heat.</small></button><button class="choice" onclick="attack('defend')"><b>Defend / Reposition</b><small>Recover stamina and reduce incoming damage.</small></button></div></div>`;updateTop();renderSide()}
function attack(mode){let c=S.combat,p=S.player;if(!c)return;let dmg=p.atk+rnd(2,8),crit=p.crit,guard=0;if(mode==="precision"){if(p.stam>=4){p.stam-=4;crit+=25;dmg+=4}else dmg-=2}if(mode==="trick"){if(p.stam>=6){p.stam-=6;dmg+=classTrick();crit+=10}else dmg-=1}if(mode==="defend"){p.stam=clamp(p.stam+6,0,p.maxStam);guard=6;dmg=0}let wasCrit=rnd(1,100)<=crit;if(wasCrit)dmg=Math.round(dmg*1.8);c.hp-=Math.max(0,dmg);if(c.hp<=0)return combatWin(wasCrit?`Critical hit for ${dmg}.`: `Hit for ${dmg}.`);let inc=Math.max(1,rnd(3,8)+S.player.floor-(guard));if(c.boss)inc+=rnd(1,5);p.hp-=inc;if(p.hp<=0)return gameOver();combatRender(`${mode==="defend"?"You reposition.":`You deal ${dmg}${wasCrit?" critical":""} damage.`} ${c.name} hits back for ${inc}.`)}
function classTrick(){let c=S.player.className;S.player.viewers+=4;S.systems.aiFavor++;if(c==="Ranger/Rogue"){S.ai.fixation="weak points";return 10+S.player.stealth}if(c==="Brawler")return 13;if(c==="Warden"){S.player.hp=clamp(S.player.hp+4,0,S.player.maxHp);return 6}if(c==="Hexer"){S.systems.exploitScore++;return rnd(8,18)}if(c==="Scavenger"){if(rnd(1,100)<35)addItem("Improvised Combat Part","uncommon","Probably useful later.");return 9}if(c==="Duelist"){S.player.viewers+=10;return 11}return 8}
function combatWin(msg){let c=S.combat;let boss=c.boss;let after=c.after;S.combat=null;S.player.stam=clamp(S.player.stam+5,0,S.player.maxStam);S.player.gold+=boss?150*S.player.floor:35*S.player.floor;S.player.viewers+=boss?40*S.player.floor:6*S.player.floor;xp(boss?80:30);log(`Defeated ${c.name}.`);if(rnd(1,100)<45)addItem(`${c.name} Drop`,pick(["common","uncommon","rare"]),"Loot acquired during combat.");if(typeof after==="function")after();else sceneForFloor()}
function gameOver(){let c=S.combat;S.combat=null;S.player.hp=1;S.systems.aiGrudge+=2;S.player.rank+=500;S.player.viewers+=20;sceneHTML("YOU DIED. SORT OF.",`<p>You hit zero HP. Because this build uses a retry-friendly campaign mode, the run rewinds to the current floor safe room instead of deleting your save.</p><p class="ai"><b>Dungeon AI:</b> I had a death announcement prepared. It was excellent. You ruined it by continuing to exist.</p>`,[{label:"Wake in safe room",action:"safeRoom()"}],FLOORS[S.player.floor-1].theme)}
function safeRoom(){S.tab="story";let unlocked=S.player.floor;sceneHTML("Safe Room",`<p>Mordecai has claimed a table. Mara is checking spear balance. Milo is cooking something that technically still has an initiative score.</p><p>You may heal, shop, visit clubs, gods, casino, crafting, rankings, or sponsor systems depending on floor unlocks.</p>`,[
 {label:"Rest and heal",sub:"50g. Full HP and stamina.",action:"heal()"},
 {label:"Clubs",sub:"Desperado and Vanquisher politics.",action:"clubs()"},
 {label:"Hall of Gods",sub:"Choose or negotiate with a patron.",action:"gods()"},
 {label:"Crooked Halo Casino",sub:"Gold, loot, terrible judgment.",action:"casino()"},
 {label:"Craft / Upgrade",sub:"Spend gold and skill points.",action:"upgradeMenu()"},
 {label:"Sponsor desk",sub:"Contracts and boxes, Floor 3+.",action:"sponsors()"},
 {label:"TV board",sub:"Game shows and audience events.",action:"gameShow()"},
 {label:"Back to floor",action:"sceneForFloor()"}
 ],"studio")}
function heal(){if(S.player.gold>=50){S.player.gold-=50;S.player.hp=S.player.maxHp;S.player.stam=S.player.maxStam;toast("Fully healed.")}safeRoom()}
function clubs(){sceneHTML("Crawler Clubs",`<p>Clubs offer perks, enemies, invitations, and the privilege of having strangers judge your branding.</p><p><b>Current:</b> ${S.systems.club||"None"}</p>`,[
 {label:"Join Desperado Club",sub:"Rogues, rule-benders, hunters, dangerous charisma.",action:"joinClub('Desperado Club')"},
 {label:"Join Club Vanquisher",sub:"Boss killers, champions, glory hounds.",action:"joinClub('Club Vanquisher')"},
 {label:"Stay independent",action:"safeRoom()"}
 ],"arena")}
function joinClub(n){if(S.systems.club&&S.systems.club!==n){S.systems.aiGrudge++;toast("Club politics detected.")}S.systems.club=n;S.player.fame+=4;S.player.viewers+=25;achieve("MEMBERS ONLY","You joined a crawler club and acquired opinions by association.");safeRoom()}
function gods(){sceneHTML("Hall of Gods",`<p>Three shrines are currently accepting dangerous emotional investments.</p><p><b>Current patron:</b> ${S.systems.god||"None"}</p>`,[
 {label:"Nyxara, Lady of the Last Arrow",sub:"Precision, darkness, finishing shots.",action:"chooseGod('Nyxara')"},
 {label:"Volkran, Lord of Broken Doors",sub:"Strength, defiance, direct solutions.",action:"chooseGod('Volkran')"},
 {label:"The Auditor",sub:"Contracts, loopholes, exact wording.",action:"chooseGod('The Auditor')"},
 {label:"No gods today",action:"safeRoom()"}
 ],"divine")}
function chooseGod(n){S.systems.god=n;S.player.fame+=3;if(n==="Nyxara")S.player.crit+=2;if(n==="Volkran")S.player.atk+=1;if(n==="The Auditor")S.player.stealth+=1;achieve("DIVINE CUSTOMER ACQUISITION",`${n} has taken an interest.`);safeRoom()}
function casino(){sceneHTML("The Crooked Halo Casino",`<p>Gold: <span class="gold">${S.player.gold}g</span>. Casino debt: ${S.systems.casinoDebt}g.</p><p>The house offers dice, loot poker, wheel curses, and drinks that may be side quests.</p>`,[
 {label:"Bet 100g",sub:"50/50-ish. The -ish belongs to the house.",action:"bet(100)"},
 {label:"Bet 500g",sub:"Bigger swing, bigger audience.",action:"bet(500)"},
 {label:"Loot Poker",sub:"Risk 250g for an item roll.",action:"lootPoker()"},
 {label:"Leave with dignity",sub:"Or the remainder thereof.",action:"safeRoom()"}
 ],"casino")}
function bet(n){if(S.player.gold<n){toast("Not enough gold.");return casino()}S.player.gold-=n;if(rnd(1,100)<=47){S.player.gold+=n*2;S.player.viewers+=n/20;achieve("HOUSE TEMPORARILY LOSES","You won a casino bet. This will be corrected eventually.")}else S.systems.aiGrudge++;casino()}
function lootPoker(){if(S.player.gold<250){toast("Need 250g.");return casino()}S.player.gold-=250;let r=rnd(1,100),rar=r>95?"legendary":r>80?"epic":r>55?"rare":"uncommon";addItem(`Casino ${pick(["Charm","Blade","Token","Scope","Pan","Ring"])}`,rar,"Won from a game with suspiciously flexible rules.");casino()}
function sponsors(){if(S.player.floor<3)return sceneHTML("Sponsor Desk Locked","<p>Sponsors begin serious recruitment on Floor 3.</p>",[{label:"Back",action:"safeRoom()"}],"broadcast");sceneHTML("Sponsor Desk",`<p><b>Current sponsor:</b> ${S.systems.sponsor||"None"}</p><p>Vanta Vectorworks offers equipment support, boxes, rescue clauses, and enough contract language to stun a horse.</p>`,[
 {label:"Sign Vanta Vectorworks",sub:"Equipment support + boss box bonus. Sponsor politics activate.",action:"signSponsor('Vanta Vectorworks')"},
 {label:"Stay independent",action:"safeRoom()"}
 ],"broadcast")}
function signSponsor(n){S.systems.sponsor=n;S.player.gold+=1000;S.systems.boxes+=2;S.player.viewers+=100;achieve("SELLING OUT, TACTICALLY","You accepted sponsor support without pretending it was friendship.");safeRoom()}
function gameShow(){let shows=["Sharpshooter Showcase","Trivia or Trauma","Panic Kitchen","Wheel of Catastrophic Consequences","Penis Parade","Price That Relic","Crawler Feud","Obstacle Night"];
 let sh=pick(shows);sceneHTML(sh,`<p>You are booked on <b>${sh}</b>. The audience is live, the rules are partially disclosed, and Milo has already found the catering table.</p><p class="ai"><b>Dungeon AI:</b> ${aiLine("show")}</p>`,[
 {label:"Play to win",sub:"Skill check, better rewards.",action:`resolveShow('${sh}',true)`},
 {label:"Play to the crowd",sub:"More viewers, less reliable rewards.",action:`resolveShow('${sh}',false)`},
 {label:"Back out",sub:"Small fame loss. Large amount of booing.",action:"safeRoom()"}
 ],"broadcast")}
function resolveShow(sh,win){let score=rnd(1,20)+S.player.level+(win?S.player.stealth:0);if(score>=12){S.systems.showWins++;S.player.gold+=300+S.player.floor*50;S.player.viewers+=40+S.player.floor*10;S.systems.boxes++;achieve(`SHOW WIN: ${sh}`,"You survived entertainment programming.")}else{S.player.hp=clamp(S.player.hp-rnd(1,6),1,S.player.maxHp);S.player.viewers+=25;S.systems.aiFavor++}safeRoom()}
function broadcastBoard(){sceneHTML("Broadcast Board",`<p><b>Global crawler rank:</b> #${S.player.rank}<br><b>Viewers:</b> ${fmtView(S.player.viewers)}<br><b>Achievements:</b> ${S.achievements.length}<br><b>Show wins:</b> ${S.systems.showWins}</p><p>Trending: ${pick(["boss deaths","club feud","sponsor betrayal","Milo's cooking segment","an argument about whether a mimic can unionize","a crawler who accidentally married a quest NPC"])}</p>`,[
 {label:"Enter a game show",action:"gameShow()"},{label:"Read AI feed",action:"S.tab='log';showTab('log')"},{label:"Back to floor",action:"sceneForFloor()"}
 ],"broadcast")}
function upgradeMenu(){sceneHTML("Upgrade Bench",`<p>Skill points: <b>${S.player.skillPoints}</b>. Gold: <b>${S.player.gold}g</b>.</p><p>Upgrades are permanent and increasingly expensive because the economy has feelings.</p>`,[
 {label:"+1 Attack",sub:"1 skill point + 300g",action:"upgrade('atk')"},
 {label:"+2% Crit",sub:"1 skill point + 300g",action:"upgrade('crit')"},
 {label:"+1 Stealth",sub:"1 skill point + 300g",action:"upgrade('stealth')"},
 {label:"+5 Max HP",sub:"1 skill point + 300g",action:"upgrade('hp')"},
 {label:"Back",action:"safeRoom()"}
 ],"machine")}
function upgrade(k){if(S.player.skillPoints<1||S.player.gold<300){toast("Need 1 skill point and 300g.");return upgradeMenu()}S.player.skillPoints--;S.player.gold-=300;if(k==="atk")S.player.atk++;if(k==="crit")S.player.crit+=2;if(k==="stealth")S.player.stealth++;if(k==="hp"){S.player.maxHp+=5;S.player.hp+=5}upgradeMenu()}
function openBox(){if(S.systems.boxes<1){toast("No boxes available.");return sceneForFloor()}S.systems.boxes--;let r=rnd(1,100)+S.player.floor;let rar=r>108?"legendary":r>90?"epic":r>60?"rare":"uncommon";addItem(`${pick(["Celestial","Sponsor","Fan","Benefactor","Boss"])} ${pick(["Scope","Quiver","Charm","Armor Plate","Ring","Weapon Mod","Mystery Meat"])}`,rar,"Box loot. May contain plot complications.");sceneForFloor()}
function characterTab(){let p=S.player;el("content").innerHTML=`<div class="section"><h2>Character</h2><div class="item"><b>${escapeHTML(p.name)}</b><br>${escapeHTML(p.className)} • ${escapeHTML(p.weapon)} • ${escapeHTML(p.trait)}<br>Level ${p.level} • XP ${p.xp}/${p.level*100}<br>Attack ${p.atk} • Crit ${p.crit}% • Stealth ${p.stealth}<br>HP ${p.maxHp} • Stamina ${p.maxStam}<br>Skill points ${p.skillPoints}</div><h3>Achievements (${S.achievements.length})</h3><div class="list">${S.achievements.map(a=>`<div class="item"><b>${escapeHTML(a.name)}</b><br><small>${escapeHTML(a.desc)}</small></div>`).join("")||"<p class=sub>No achievements yet.</p>"}</div></div>`}
function inventoryTab(){el("content").innerHTML=`<div class="section"><h2>Loot</h2><p>Boxes available: ${S.systems.boxes}</p><button class="choice" onclick="openBox()"><b>Open a box</b><small>Uses one available loot box.</small></button><div class="list" style="margin-top:12px">${S.inventory.map(i=>`<div class="item"><b class="rarity-${i.rarity}">${escapeHTML(i.name)}</b> <span class="pill">${i.rarity}</span><br><small>${escapeHTML(i.desc)}</small></div>`).join("")}</div></div>`}
function partyTab(){el("content").innerHTML=`<div class="section"><h2>Party</h2><div class="list">${S.party.map(m=>`<div class="item"><b>${escapeHTML(m.name)}</b> • ${escapeHTML(m.role)}<br><small>Bond ${m.bond}. ${m.name==="Milo"?"Has converted at least three kitchen tools into legally recognized weapons.":"Still here despite ample evidence."}</small></div>`).join("")}<div class="item"><b>Mordecai</b> • Guide/manager<br><small>Professional survivor of everyone else's decisions.</small></div><div class="item"><b>Quinn</b> • Attorney<br><small>Becomes increasingly important when producers start getting creative with contracts.</small></div></div></div>`}
function systemsTab(){el("content").innerHTML=`<div class="section"><h2>Dungeon Systems</h2><div class="list"><div class="item"><b>Dungeon AI</b><br>Favor ${S.systems.aiFavor} • Grudge ${S.systems.aiGrudge} • Interruptions ${S.ai.interrupts}<br><small>Fixation: ${S.ai.fixation||"none yet"}. Exploit score: ${S.systems.exploitScore}.</small></div><div class="item"><b>Clubs</b><br>${S.systems.club||"Independent"}</div><div class="item"><b>God</b><br>${S.systems.god||"Unclaimed"}</div><div class="item"><b>Sponsor</b><br>${S.systems.sponsor||"Independent"}</div><div class="item"><b>Broadcast</b><br>${fmtView(S.player.viewers)} viewers • rank #${S.player.rank} • ${S.systems.showWins} show wins</div><div class="item"><b>Economy</b><br>${S.player.gold}g • ${S.systems.boxes} unopened boxes • casino debt ${S.systems.casinoDebt}g</div><div class="item"><b>Recurring content</b><br>Achievements, sponsor/fan/benefactor boxes, clubs, gods, TV shows, casino, audience voting, floor events, boss broadcasts, prior-crawler knowledge, loopholes, crafting, auctions, pets/summons as loot events, death announcements, rankings and sponsor politics.</div></div></div>`}
function floorsTab(){el("content").innerHTML=`<div class="section"><h2>Fifteen-Floor Campaign</h2><div class="floorMap">${FLOORS.map(f=>`<div class="floorNode ${f.n<S.player.floor?"done":f.n===S.player.floor?"now":"lock"}"><b>${f.n}. ${f.name}</b><br><small>${f.hook}</small><br><span class="pill">${f.mechanic}</span></div>`).join("")}</div></div>`}
function logTab(){el("content").innerHTML=`<div class="section"><h2>Dungeon AI / Event Feed</h2><div class="log">${S.log.map(x=>`<div class="logrow">${escapeHTML(x)}</div>`).join("")||"<div class=logrow>No feed entries yet.</div>"}</div></div>`}
function saveTab(){el("content").innerHTML=`<div class="section"><h2>Save / Load</h2><p>Progress saves in this browser using local storage.</p><div class="choiceGrid"><button class="choice" onclick="save()"><b>Save Game</b><small>Store current run.</small></button><button class="choice" onclick="load()"><b>Load Game</b><small>Restore stored run.</small></button><button class="choice" onclick="exportSave()"><b>Export Save</b><small>Download a JSON backup.</small></button><button class="choice" onclick="resetGame()"><b>New Character</b><small>Erase this browser's save and restart.</small></button></div></div>`}
function exportSave(){const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`broadcast-dungeon-${S.player.name}.json`;a.click();URL.revokeObjectURL(a.href)}
function resetGame(){if(confirm("Erase current local save and create a new character?")){localStorage.removeItem(SAVE_KEY);S=fresh();creator()}}
function ending(){let score=S.systems.aiFavor-S.systems.aiGrudge+S.systems.exploitScore+(S.systems.club?2:0)+(S.systems.god?2:0);let ending=score>8?"You break the format without breaking the party. The final studio loses control of its own show.":score<-4?"You win, but the Dungeon AI files a complaint so detailed it becomes a new floor mechanic.":"You survive the Last Studio and walk out as the kind of crawler sponsors pretend they discovered first.";sceneHTML("FLOOR 15 COMPLETE: THE LAST STUDIO",`<p>${ending}</p><p><b>Final rank:</b> #${S.player.rank}<br><b>Viewers:</b> ${fmtView(S.player.viewers)}<br><b>Achievements:</b> ${S.achievements.length}<br><b>AI favor/grudge:</b> ${S.systems.aiFavor}/${S.systems.aiGrudge}</p><p class="good"><b>CAMPAIGN COMPLETE.</b> You can keep the save, replay shows and casino systems, or create a new crawler.</p>`,[{label:"Freeplay safe room",action:"safeRoom()"},{label:"New crawler",action:"resetGame()"}],"studio")}
function creator(){let selected="Ranger/Rogue";let weapon="Bow";el("modal").innerHTML=`<div class="modal"><div class="modalBox"><h1>CREATE YOUR CRAWLER</h1><p>The cameras are already on. This seems premature, but production has standards.</p><div class="creatorGrid"><div class="field"><label>Name</label><input id="ccName" maxlength="24" value="Larry"></div><div class="field"><label>Starting weapon</label><select id="ccWeapon">${Object.keys(WEAPONS).map(w=>`<option ${w==="Bow"?"selected":""}>${w}</option>`).join("")}</select></div><div class="field"><label>Defining trait</label><select id="ccTrait"><option>Defiant</option><option>Patient</option><option>Greedy</option><option>Protective</option><option>Showboat</option><option>Suspicious</option></select></div><div class="field"><label>Campaign mode</label><select disabled><option>Retry-Friendly (15 floors)</option></select></div></div><h3>Class path</h3><div class="classes" id="classCards">${Object.entries(CLASSES).map(([n,c])=>`<div class="classCard ${n===selected?"on":""}" data-class="${n}" onclick="selectClass('${n}')"><b>${n}</b><br><small>${c.desc}</small><br><span class="pill">${c.perk}</span></div>`).join("")}</div><div id="ccPreview" class="item" style="margin-top:12px"></div><button class="choice" style="width:100%;margin-top:12px" onclick="createCharacter()"><b>ENTER FLOOR 1</b><small>Start the fifteen-floor campaign.</small></button></div></div>`;window._ccClass=selected;previewCreator();el("ccWeapon").addEventListener("change",previewCreator);}
function selectClass(n){window._ccClass=n;document.querySelectorAll(".classCard").forEach(x=>x.classList.toggle("on",x.dataset.class===n));previewCreator()}
function previewCreator(){let c=CLASSES[window._ccClass||"Ranger/Rogue"];let w=WEAPONS[el("ccWeapon")?.value||"Bow"];if(el("ccPreview"))el("ccPreview").innerHTML=`<b>Starting stats</b><br>HP ${c.hp} • Stamina ${c.stam} • Attack ${c.atk+w.atk} • Crit ${c.crit+w.crit}% • Stealth ${c.stealth}<br><small>Signature perk: ${c.perk}. Weapon tag: ${w.tag}.</small>`}
function createCharacter(){let n=(el("ccName").value||"Crawler").trim(),cl=window._ccClass||"Ranger/Rogue",w=el("ccWeapon").value,t=el("ccTrait").value,c=CLASSES[cl],we=WEAPONS[w];S=fresh();Object.assign(S.player,{name:n,className:cl,weapon:w,trait:t,hp:c.hp,maxHp:c.hp,stam:c.stam,maxStam:c.stam,atk:c.atk+we.atk,crit:c.crit+we.crit,stealth:c.stealth});S.created=true;S.inventory=[{name:`Starter ${w}`,rarity:"common",desc:`Your first ${w.toLowerCase()}. Production insists it has been tested.`}];if(cl==="Ranger/Rogue"&&w==="Bow")S.inventory.push({name:"Black Bow Prototype",rarity:"uncommon",desc:"A bow with enough personality to become a future problem."});el("modal").innerHTML="";log(`Dungeon AI: Welcome, ${n}. ${aiLine("scene")}`);saveSilent();render();sceneForFloor()}
function escapeHTML(s){return String(s).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
window.addEventListener("error",e=>{toast(`<b>Game error:</b> ${escapeHTML(e.message||"unknown")}`)});
(function boot(){let x=localStorage.getItem(SAVE_KEY);if(x){try{S=Object.assign(fresh(),JSON.parse(x));S.created=true}catch(e){S=fresh()}}if(!S.created){render();creator()}else{render();sceneForFloor(true)}})();
</script>
</body>
</html>
