<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b13"><title>Broadcast Dungeon: Complete Fifteen-Floor Campaign</title>
<style>
:root{--bg:#06080e;--panel:#111827;--panel2:#172136;--line:#2c3955;--ink:#eef5ff;--muted:#9fb0ca;--accent:#73e5ff;--gold:#ffd56a;--danger:#ff6e7a;--good:#72e7a6;--violet:#c5a5ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#182640,#080b13 36%,#04060a 80%);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}
#app{max-width:1220px;margin:auto;padding:12px 12px 90px}.top{position:sticky;top:0;z-index:20;display:flex;gap:10px;justify-content:space-between;align-items:center;padding:8px 0 16px;background:linear-gradient(#080b13f5,#080b13c0,#080b1300)}.brand{font-weight:1000;letter-spacing:.05em}.brand span{color:var(--accent)}.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.chip{font-size:12px;padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:#0e1624}
.grid{display:grid;grid-template-columns:310px minmax(0,1fr);gap:14px}.card{background:linear-gradient(#151e31,#0d1421);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 60px #0005}.side{padding:14px;height:max-content;position:sticky;top:68px}.main{overflow:hidden;min-height:720px}.portrait{height:165px;border:1px solid #35445f;border-radius:14px;background:linear-gradient(135deg,#1d3553,#0b0f18);display:grid;place-items:center;font-size:62px}.name{font-size:24px;font-weight:1000;margin-top:10px}.sub,.muted{color:var(--muted)}.bar{height:9px;background:#070b12;border:1px solid #263248;border-radius:99px;overflow:hidden;margin:5px 0 10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#52cc8a,#8effc4)}.bar.st i{background:linear-gradient(90deg,#5a9dff,#73e5ff)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{padding:8px;border:1px solid #263248;background:#0b1220;border-radius:10px}.stat b{display:block}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px;border-bottom:1px solid var(--line)}.tab{border:1px solid #364562;color:#d9e5f7;background:#101827;padding:8px 11px;border-radius:99px}.tab.on{border-color:var(--accent);background:#18334b}
.section,.scene{padding:18px}h1{font-size:clamp(30px,5vw,52px);line-height:1;margin:.1em 0 .3em}h2{margin:.2em 0 .6em}h3{margin-top:22px}p{line-height:1.5}.banner{min-height:210px;border:1px solid #34435f;border-radius:15px;margin-bottom:15px;padding:22px;background:linear-gradient(135deg,#10223b,#0b101a);display:flex;flex-direction:column;justify-content:end}.banner .big{font-size:clamp(30px,6vw,70px);font-weight:1000;opacity:.9}
.ai{border-left:4px solid var(--accent);background:linear-gradient(90deg,#21496355,#21496310);padding:11px 12px;border-radius:0 10px 10px 0}.guide{border-left:4px solid var(--gold);background:#5a461c28;padding:11px 12px}.law{border-left:4px solid var(--violet);background:#4b35622b;padding:11px 12px}.partyline{border-left:4px solid var(--good);background:#1e4d3224;padding:10px 12px}.announcement{border:1px solid #7a2730;background:linear-gradient(135deg,#50192155,#1a0c0f);padding:14px;border-radius:12px}.sceneCard{padding:12px;border:1px solid #2b3852;border-radius:12px;background:#0c1422;margin:9px 0}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:13px}.choice{padding:13px;border:1px solid #3a4968;background:linear-gradient(#18243a,#101827);color:#fff;border-radius:12px;text-align:left;min-height:62px}.choice:hover{border-color:var(--accent)}.choice b{display:block}.choice small{color:var(--muted)}
.item{padding:10px;border:1px solid #28344c;border-radius:11px;background:#0c1320;margin:7px 0}.pill{display:inline-block;padding:3px 7px;border:1px solid #3a4864;border-radius:99px;font-size:11px;margin:2px;color:#d3def0}.good{color:var(--good)}.bad{color:var(--danger)}.gold{color:var(--gold)}.violet{color:var(--violet)}.floorgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.floor{padding:10px;border:1px solid #34415d;border-radius:10px;background:#0c1320}.floor.now{border-color:var(--accent)}.floor.done{border-color:#4c8768}.floor.lock{opacity:.45}.modal{position:fixed;inset:0;background:#020409e8;z-index:99;display:grid;place-items:center;padding:14px}.modalbox{width:min(920px,100%);max-height:94vh;overflow:auto;background:#101827;border:1px solid #3a4862;border-radius:18px;padding:17px}.creator{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}input,select{background:#090f1a;color:#fff;border:1px solid #35415a;border-radius:9px;padding:10px}.classgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.classcard{padding:10px;border:1px solid #35425d;background:#0c1320;border-radius:10px}.classcard.on{border-color:var(--accent);background:#163048}.toast{position:fixed;right:14px;bottom:16px;z-index:120;max-width:370px;padding:11px 13px;background:#111c2e;border:1px solid #4d7390;border-radius:11px;box-shadow:0 12px 40px #0009}.log{max-height:520px;overflow:auto}.logrow{padding:8px;border-bottom:1px solid #222d42;font-size:13px}
@media(max-width:840px){.grid{grid-template-columns:1fr}.side{position:static}.choices{grid-template-columns:1fr}.floorgrid{grid-template-columns:1fr 1fr}.classgrid{grid-template-columns:1fr 1fr}.creator{grid-template-columns:1fr}.main{min-height:560px}}
</style></head><body><div id="app"><div class="top"><div class="brand">📡 BROADCAST <span>DUNGEON</span></div><div class="chips"><div class="chip" id="dayChip"></div><div class="chip" id="floorChip"></div><div class="chip" id="rankChip"></div><div class="chip" id="viewerChip"></div><div class="chip" id="goldChip"></div></div></div><div class="grid"><aside class="card side" id="side"></aside><main class="card main"><div class="tabs" id="tabs"></div><div id="content"></div></main></div></div><div id="modal"></div><div id="toast"></div>
<script>"use strict";
const DATA={"floors":[{"n":1,"name":"The Underworks","boss":"Collector Crusher","mechanic":"Noise meter","npc":"Greasebox Nella","show":"Trivia or Trauma","hook":"A rusted industrial maze where conveyors, compactors, and sponsor drones teach you that architecture counts as an enemy.","scenes":["Conveyors start moving before the lights come on. A crawler three lanes over screams at a lever labeled EMERGENCY STOP. The lever dispenses a coupon.","Nella waves from inside a maintenance cage. 'If you're new, rule one is don't trust anything painted safety yellow.'","A sponsor drone scans your face, rejects your market demographic, then tags Mara instead. Mara throws a wrench at it.","The floor announcement claims the crusher is 'optional.' Mordecai points at six crushed helmets welded into the wall and says, 'Optional has a dungeon definition.'"],"quests":[{"name":"Baler Rescue","desc":"Free a trapped crawler before the compactor cycles.","mord":"The reset switch is not the red one. The red one starts applause.","quinn":"The objective says rescue, not remain nearby afterward. Get them out, then leave.","reward":"Hydraulic Door Spike"},{"name":"Sponsor Crate Theft","desc":"Steal a tagged sponsor crate without accepting the contract inside.","mord":"If it asks you to say your name aloud, don't.","quinn":"Possession is not acceptance. I will enjoy explaining that to them.","reward":"Unclaimed Sponsor Box"},{"name":"Maintenance Map","desc":"Find Mordecai's old service route map.","mord":"That map has a route nobody uses because everyone assumes it's decorative.","quinn":"If the route isn't listed in the public floor rules, production can't penalize you for using it.","reward":"Old Route Token"}],"loot":["Magnetic Arrowheads","Rustproof Bracers","Chain-Hound Collar","Conveyor Greaves","Greaseproof Quiver","Maintenance Badge"],"bossPhases":["The Crusher rolls forward behind a wall of dangling chains.","The floor tilts and feeds loose scrap toward the boss.","Its armor opens to vent heat, revealing a glowing hydraulic manifold."],"safe":["Milo cooks something on a motor housing and insists the oil is 'basically seasoning.'","Dane checks every bunk twice before sleeping. Tessa steals the better pillow anyway.","Mara asks if you think the announcements are prerecorded. The AI answers through the wall: 'No.'"],"ai":["Welcome to Floor One. Please die somewhere with adequate lighting.","You found the maintenance lane. That was supposed to take longer.","Congratulations on identifying that the machine labeled crusher does, in fact, crush.","The bow is not a personality. Yet you persist."]},{"n":2,"name":"The Howling Cathedral","boss":"Choirmaster Null","mechanic":"Silence vs spectacle","npc":"Sister Hush","show":"Wheel of Catastrophic Consequences","hook":"A cathedral that punishes noise until it needs ratings, then punishes silence instead.","scenes":["Every pew is chained to the floor. One of them whispers your name when you pass.","Sister Hush speaks only by writing on slate. Her first message: THE BELLS LIE.","The choir loft contains twelve masked figures and one microphone with a blinking red light.","An iron door reads OPEN WITH PRAYER. Quinn squints. 'Prayer is not a defined term.'"],"quests":[{"name":"Bell Gallery","desc":"Cross the gallery without triggering a single bell.","mord":"Watch the floor shadows, not the bells.","quinn":"The rule prohibits ringing bells. It does not prohibit removing clappers.","reward":"Mute Bell Charm"},{"name":"Free the Acolytes","desc":"Release three mute acolytes bound to the sound engine.","mord":"The locks respond to rhythm. Dane can fake a march cadence.","quinn":"Their contracts expired six floors ago. Production forgot to free them.","reward":"Echo Flask"},{"name":"Silent Ratings Win","desc":"Win an audience challenge without speaking.","mord":"Milo can pantomime. Badly, but memorably.","quinn":"No speech does not mean no signage.","reward":"Choirbone String"}],"loot":["Mute Bell Charm","Choirbone String","Echo Flask","Votive Knife","Silent Step Wraps","Chorus Ward"],"bossPhases":["Null conducts sonic blades through the nave.","Every missed beat summons a glass choir clone.","The boss removes its mask and the entire floor enters forced silence."],"safe":["Rex tries whispering and somehow whispers at full volume.","Quinn writes legal advice on napkins because the walls react to voices.","Mordecai admits he hates floors where the rules care about sound. The AI makes a tiny bell noise every thirty seconds afterward."],"ai":["Shhh. Or don't. I have two punishment tables ready.","You weaponized punctuation. Quinn looks proud.","Audience polling says Rex whispering is funnier than intended.","I muted Milo for twelve seconds. Ratings fell. Never again."]},{"n":3,"name":"City of Teeth","boss":"Crow Veyr","mechanic":"Faction heat and sniper lines","npc":"Crow Veyr","show":"The Last Shot","hook":"A murderous sponsor city where rooftops, bounty windows, clubs, and production contracts matter as much as combat.","scenes":["A billboard updates with your face and a bounty before you have entered the district.","Three snipers track you from separate roofs. Tessa points out that only two are breathing.","An Exit Club courier hands Quinn a folded contract and immediately gets tackled by a mascot.","Crow's message appears on a dead terminal: IF YOU'RE HERE TO KILL ME, MISS YOUR FIRST SHOT."],"quests":[{"name":"Trace the Leak","desc":"Find who sold route data to the Red Knives.","mord":"Look for sponsor access codes in the maintenance logs.","quinn":"Chain of custody matters if we want to use this against production later.","reward":"Producer Access Fragment"},{"name":"Exit Club Contact","desc":"Meet the club courier without triggering the bounty district.","mord":"Take the laundry bridge. Everyone ignores laundry.","quinn":"The bounty applies to 'streets.' The bridge is privately owned.","reward":"Exit Club Evidence"},{"name":"Rooftop Bounty","desc":"Survive ninety seconds while the city broadcasts your location.","mord":"Keep moving. Never take the second-best cover twice.","quinn":"The contract guarantees extraction at ninety seconds. I timed the clause.","reward":"Zero-Line Lens"}],"loot":["Zero-Line Lens","Knife-Courier Coat","Teeth City Pass","Hot Mic","Red Knife Token","Vanta Field Voucher"],"bossPhases":["Crow refuses to fire first and waits for your decision.","Production activates hidden rooftop turrets when neither of you cooperates.","Selene's authorization code appears in the targeting feed, turning the fight into evidence."],"safe":["Mara asks whether you trust Crow. Tessa answers first: 'No. But I trust that he hates the same people we do.'","Quinn rewrites The Last Shot terms on a wall-sized screen while production keeps trying to close the window.","Mordecai quietly says this is the floor where crawlers start learning the show can be attacked indirectly."],"ai":["The Last Shot has excellent branding and terrible labor practices.","You missed on purpose. I am filing that under 'annoyingly clever.'","Production says this is not a conspiracy. Production also says the turrets are decorative.","Crow is not your friend. He may, however, be useful television."]},{"n":4,"name":"The Orchard of Knives","boss":"The Grafting Saint","mechanic":"Mutation clock","npc":"Old Man Pith","show":"Produce or Perish","hook":"A living orchard where fruit bites, roots bargain, and mutations can become upgrades or disasters.","scenes":["A pear screams when Milo picks it. Milo apologizes, then checks if it is ripe.","Old Man Pith offers directions in exchange for one memory you do not need.","Roots grow across your boots and spell BUY LOCAL.","The Orchard Church advertises free grafting consultations and nonrefundable limbs."],"quests":[{"name":"Biting Harvest","desc":"Collect three predator fruits without being marked for grafting.","mord":"Use the dead branches as scent cover.","quinn":"Harvest rights are explicitly granted to 'participants.' It does not say human participants.","reward":"Starfruit Resin"},{"name":"Burn the Ledger","desc":"Destroy the Saint's mutation debt ledger.","mord":"The ledger is alive. Do not let Milo cook it until after we read it.","quinn":"I want photographs first. Then fire.","reward":"Graft-Debt Nullifier"},{"name":"Root Curse","desc":"Break the curse attaching itself to Mara's spear arm.","mord":"The curse transfers by touch. Use a tool, not your hand.","quinn":"The blessing disclaimer contradicts the injury waiver. Beautiful.","reward":"Thornstep Boots"}],"loot":["Starfruit Resin","Thornstep Boots","Living Bow Limb","Seed of Second Chances","Briar Mail","Orchard Hunter Mark"],"bossPhases":["The Saint grows weapon-limbs from nearby trees.","Every wound sprouts aggressive vines unless cauterized.","The Saint offers a power bargain mid-fight that permanently changes your build."],"safe":["Milo labels three edible fruits, two explosive fruits, and one fruit 'emotionally complicated.'","Rex tries to arm wrestle a root. The root wins.","Mara stares at the graft scar and says, 'I am never eating salad again.'"],"ai":["The fruit is screaming because it cares.","You declined a free mutation. Very conservative of you.","I am told the roots have unionized. Quinn has become unbearable.","Milo has eaten three hazardous botanicals and somehow improved morale."]},{"n":5,"name":"The Dead Mall","boss":"Regional Manager","mechanic":"Economy warfare","npc":"Assistant Manager Vex","show":"Price Is Probably Wrong","hook":"An undead shopping complex where discounts, inventory, loyalty points, and rent traps can kill faster than monsters.","scenes":["The directory lists FOOD COURT, ARMORY, NECROMANCY, and CUSTOMER SERVICE with equal confidence.","A skeleton kiosk worker asks if you want to join the rewards program. Quinn says, 'Absolutely not.'","Milo hears a fryer turn on in the food court and becomes visibly emotional.","The escalator to level two only moves downward. Dane starts climbing anyway."],"quests":[{"name":"Sporting Goods Vault","desc":"Raid the locked gear store during a flash-sale stampede.","mord":"The mannequin aisle is safer than the checkout lanes.","quinn":"Flash sale means price reduction, not consent to trampling.","reward":"Clearance Sigil"},{"name":"Auction Sabotage","desc":"Crash a sponsor auction selling captured crawler gear.","mord":"Tessa can swap lot numbers.","quinn":"If they cannot prove title, they cannot sell it. Let's make that everyone's problem.","reward":"House Auction Key"},{"name":"Food Court Coup","desc":"Help Milo take control of the combat kitchen.","mord":"I have no guidance for this. I am choosing to trust Milo.","quinn":"There is a surprisingly enforceable kitchen challenge clause.","reward":"Pan of Lunch Vengeance"}],"loot":["Clearance Sigil","Escalator Greaves","Coupon of Dubious Resurrection","Mall Security Baton","Food Court Crown","Return Policy Charm"],"bossPhases":["The Manager summons security shutters to reshape the arena.","Every 25% health loss triggers a mandatory upsell phase.","At low health, the boss invokes STORE CREDIT and resurrects one defeated minion."],"safe":["Milo serves pretzels. Nobody asks where the dough came from.","Tessa returns with six shopping bags and refuses to explain.","Quinn spends an hour reading the mall's return policy and emerges smiling in a way everyone dislikes."],"ai":["Attention shoppers: everything must go. Especially you.","Quinn has discovered a refund exploit. Finance is screaming.","Milo has seized the food court. This was not in the production bible.","Rex bought armor from a kiosk. It came with a phone plan."]},{"n":6,"name":"The Flooded Kingdom","boss":"King Undertow","mechanic":"Breath meter","npc":"Ferryman Lark","show":"Sink or Swim","hook":"A drowned kingdom where oxygen, currents, tolls, and air markets turn movement into resource management.","scenes":["The first street is underwater and still has functioning parking meters.","Ferryman Lark charges one secret per passenger. Quinn offers a terms-and-conditions page instead.","Dane's shield drifts past in a current followed by three skeleton fish.","A tower bell rings from thirty feet underwater."],"quests":[{"name":"Debt Ferryman","desc":"Break Lark's binding contract with the kingdom.","mord":"His chain is anchored to the tollhouse, not the boat.","quinn":"The debt renews whenever he accepts payment. We will not pay him.","reward":"Ferryman Token"},{"name":"Recover Last Wall","desc":"Retrieve Dane's shield from the undertow vault.","mord":"Follow the bubbles going down. They're venting from the vault.","quinn":"Salvage law is complicated. Fortunately the dungeon is not a country.","reward":"Undertow Cloak"},{"name":"Dry Vault","desc":"Open a sealed treasury without flooding it.","mord":"There are two valves and one liar. Pick the liar last.","quinn":"The vault label says authorized personnel. Mordecai counts.","reward":"Drowned King's Coin"}],"loot":["Undertow Cloak","Gill Charm","Drowned King's Coin","Pressure Bowstring","Tideglass Flask","Royal Air Token"],"bossPhases":["Undertow fights from a throne mounted on a moving wave.","The room floods completely and air pockets become contested terrain.","The King's crown breaks, exposing the parasite controlling the body."],"safe":["Dane polishes Last Wall for twenty straight minutes without speaking.","Milo makes soup. Nobody finds this funny until he says, 'What? We have water.'","Mara sleeps in armor after the flood alarms go off twice by mistake."],"ai":["Please remember to breathe responsibly.","The Ferryman accepts secrets. I recommend giving him Rex's cooking opinions.","Dane has recovered his shield. Architecture is once again afraid.","You found an air exploit. Biology is filing an appeal."]},{"n":7,"name":"The Red Arena","boss":"The Ratings Champion","mechanic":"Crowd favor","npc":"Announcer Brix","show":"Sharpshooter Showcase","hook":"A mandatory arena season where style, mercy, brutality, and audience voting all affect the rules.","scenes":["Brix introduces you using three titles you have never earned and one insult you probably did.","The crowd boos when Dane blocks a killing blow and then cheers when he flips the attacker over a rail.","A producer hands Quinn a 'friendly participation rider.' Quinn tears it in half without reading the second page.","The champion watches your warmup and gives you a small respectful nod."],"quests":[{"name":"Perfect Round","desc":"Win an arena match without taking damage.","mord":"Use the pillars until the crowd hates you, then switch tempo.","quinn":"No minimum engagement time. Abuse that.","reward":"Champion's Tape"},{"name":"Rigged Bracket","desc":"Expose production's manipulated matchup tree.","mord":"The backstage monitors use old firmware.","quinn":"If we can prove selective seeding, I can void the elimination clause.","reward":"Bracket Override"},{"name":"Mercy Match","desc":"Save an opponent marked for execution without losing the bout.","mord":"Ring-out still counts as defeat.","quinn":"Exactly. Defeat is not death. My favorite distinction.","reward":"Crowdheart Ring"}],"loot":["Champion's Tape","Crowdheart Ring","Arena Kill-Token","Spotlight Mantle","Bloodless Victory Medal","Brix's Microphone"],"bossPhases":["The Champion mirrors your class ability.","Audience votes add rotating hazards every round.","At 20% health, the Champion yields if you offer a legitimate exit."],"safe":["Rex reenacts his best arena hit six times. The AI supplies slow-motion sound effects.","Mara admits she liked the crowd chanting her name. Quinn says, 'That is how they get you.'","Mordecai reminds everyone that popularity is a resource, not affection."],"ai":["The crowd loves you. This is a threat assessment, not praise.","Mercy achieved higher ratings than violence. Production is furious.","Brix has used the phrase 'historic upset' nine times today.","You are now marketable enough to be inconvenient."]},{"n":8,"name":"The Glass Desert","boss":"Mirror Wyrm","mechanic":"Mirage checks","npc":"Mirage Scout Sola","show":"Desert Feud","hook":"A desert of reflective sand where fake objectives, false exits, and mirrored copies turn certainty into a liability.","scenes":["The horizon shows five towers. Mordecai says only two exist.","Your reflection walks three seconds behind you, then stops copying.","Sola shoots an arrow at empty air and hits a hidden crawler-shaped parasite.","A sign says WATER 2 MILES. Quinn notices the arrow points in two directions."],"quests":[{"name":"Real Oasis","desc":"Identify the actual oasis among six mirages.","mord":"Watch insects. The dungeon fakes light better than life.","quinn":"The water guarantee only applies to marked sources. Convenient.","reward":"Mirage Flask"},{"name":"Sponsor Caravan","desc":"Escort a sponsor convoy while quietly stealing its route data.","mord":"Stay ahead of the second wagon. That's where the tracking rig is.","quinn":"Their escort agreement never defines confidential navigation data.","reward":"Caravan Route Chip"},{"name":"Mirror Duel","desc":"Defeat your mirrored double without using your primary weapon.","mord":"It copies habits, not creativity.","quinn":"The rule bans your primary weapon. It does not ban borrowing Mara's.","reward":"Sun-Splitter Scope"}],"loot":["Sun-Splitter Scope","Glass Jackal Fang","Mirage Flask","Sandstep Cloak","Reflection Knife","Heat-Sink Wraps"],"bossPhases":["The Wyrm splits into reflections with shared damage.","The arena becomes a rotating mirror maze.","Its final form only appears in reflections, forcing indirect shots."],"safe":["Tessa refuses to sleep near mirrors and covers every shiny surface with socks.","Milo grills something called a glass lizard and says crunch is a texture.","Quinn writes 'DO NOT AGREE WITH YOUR REFLECTION' on the wall."],"ai":["One of those exits is real. Statistically comforting.","Your reflection has better posture.","You borrowed Mara's spear to satisfy a technicality. Quinn is glowing.","The desert has no shade. I checked."]},{"n":9,"name":"The Machine Parish","boss":"Saint Firmware","mechanic":"Corruption meter","npc":"Deacon Patch","show":"Upgrade or Die","hook":"A cathedral-factory where mechanical saints offer enhancements that may rewrite classes, loyalties, or identity.","scenes":["Deacon Patch blesses a wrench before using it on his own spine.","A machine angel offers you a firmware update with an 18-page consent screen.","Mordecai says the old crawler notes called this floor 'the patch notes with knives.'","Quinn discovers the warranty voids if you survive."],"quests":[{"name":"Steal Your File","desc":"Recover the system profile production uses to predict your choices.","mord":"It'll be under behavioral modeling, not your name.","quinn":"Copy everything. We are going to weaponize discovery.","reward":"Behavior Model Shard"},{"name":"Warranty Angel","desc":"Free a mechanical angel trapped enforcing service contracts.","mord":"Break the service loop, not the chassis.","quinn":"It has been working without pay. I am adding labor claims to the list.","reward":"Warranty Halo"},{"name":"Class Exploit","desc":"Use a deprecated upgrade path the dungeon forgot to remove.","mord":"Do it once. Twice gets noticed.","quinn":"Deprecated is not prohibited.","reward":"Patchwork Core"}],"loot":["Patchwork Core","Warranty Halo","Servo Quiver","Firmware Fang","Blessed Heat Sink","Angel Circuit"],"bossPhases":["Firmware disables one random ability each round.","The boss copies one party member's gear function.","Final phase offers a dangerous permanent upgrade instead of continuing combat."],"safe":["Rex asks if he can get a mechanical arm despite still having both arms.","Milo tries to install a kitchen timer into his pan. It becomes self-aware for nine minutes.","Mordecai confiscates three glowing screws from Tessa."],"ai":["Update available. Changes include stability improvements and one new betrayal.","Your behavioral model says you will choose the bow. Stunning.","Quinn has subpoenaed a machine saint. I did not know that was possible.","Please restart your personality to complete installation."]},{"n":10,"name":"The Black Casino","boss":"House Mother","mechanic":"Risk contracts","npc":"Dealer Lucky Mae","show":"Wheel of Ruin","hook":"A casino where HP, gear, names, memories, relationships, and future loot can all be wagered.","scenes":["Lucky Mae deals cards with four hands and smiles with none of her eyes.","The blackjack table offers +2 attack as collateralized debt.","A roulette wheel includes wedges labeled GOLD, CURSE, DIVORCE, and MYSTERY HORSE.","Quinn refuses a complimentary drink because the napkin contains a waiver."],"quests":[{"name":"Loaded Table","desc":"Prove a sponsor table is cheating without getting thrown out.","mord":"Watch the dealer's left thumb.","quinn":"If they call it random in advertising, rigging it becomes useful evidence.","reward":"Loaded Coin"},{"name":"Win Back a Name","desc":"Recover an NPC's stolen legal name from the high-roller cage.","mord":"Names matter here. Do not say yours near the red tables.","quinn":"Identity cannot be valid consideration under this contract. I am personally offended.","reward":"Housebreaker Chip"},{"name":"No-Bet Vault","desc":"Reach the high-roller vault without placing a wager.","mord":"Service corridors do not count as gaming areas.","quinn":"Finally, a challenge written by someone careless.","reward":"Velvet Armor Lining"}],"loot":["Housebreaker Chip","Loaded Coin","Velvet Armor Lining","Jackpot Charm","Dealer's Sleeve","Risk Dividend Token"],"bossPhases":["House Mother forces a wager before each attack cycle.","Losing bets spawn debt collectors.","At low health, the boss offers to forgive all debt if you throw the fight."],"safe":["Mara wins three hands and immediately quits. Rex calls this cowardice until he loses his boots.","Quinn keeps a ledger of every illegal table rule and seems happier than at any prior floor.","Milo invents a drink called the Responsible Gambler. It is just water."],"ai":["The house always wins. Unless Quinn reads the paperwork first.","You walked through a casino without betting. Marketing has flagged you as defective.","Rex wagered his boots. This is now a character arc.","House Mother has offered a settlement. Quinn laughed for thirty-four seconds."]},{"n":11,"name":"The Bone Railway","boss":"Conductor Nine","mechanic":"Timed route splits","npc":"Ticketmaster Orr","show":"Carriage Carnage","hook":"A train-city in permanent motion where missed stops vanish, route choices split parties, and cars rearrange under fire.","scenes":["The platform arrives before the train and keeps moving after it.","Orr punches a ticket directly through a crawler's glove and apologizes for the inconvenience.","Tessa disappears into the next carriage just before the doors lock behind her.","The route map lists one stop called REGRET with no arrival time."],"quests":[{"name":"Prison Car","desc":"Uncouple a prisoner carriage before it enters the furnace tunnel.","mord":"The coupling release is outside the car.","quinn":"Prisoners are classified as cargo. Horrifying, but exploitable.","reward":"Railstep Boots"},{"name":"Route Book","desc":"Steal the conductor's master timetable.","mord":"It is probably physically chained to him.","quinn":"Timetables become evidence when used to stage deaths.","reward":"Conductor's Whistle"},{"name":"Disappearing Car","desc":"Recover Tessa before her carriage exits the route graph.","mord":"Jump at the junction, not before.","quinn":"Production guaranteed continuous party access. This is breach.","reward":"Bone Ticket"}],"loot":["Railstep Boots","Conductor's Whistle","Bone Ticket","Switchyard Knife","Steamglass Goggles","Emergency Brake Sigil"],"bossPhases":["Nine fights across three linked moving cars.","Track switches split the arena every two rounds.","Final phase takes place on the roof while the train enters a collapsing tunnel."],"safe":["Tessa pretends being stranded was 'mostly t."]},{"name":"Milo","gear":"The Final Course","role":"combat chef, pan specialist, ratings anomaly","banter":["Good news. It is edible.","Bad news. It is also armed.","I can fix morale or lunch. Sometimes both."]}],"cameos":[{"name":"The Retired Crawler","text":"A scarred veteran appears in a service tunnel, gives one useful sentence, refuses to explain it, and vanishes.","reward":"Old Route Token"},{"name":"The Overqualified Janitor","text":"A janitor deletes an elite monster with a mop and asks whether you've seen his bucket.","reward":"Industrial Mop Head"},{"name":"The Hair-Metal Prophet","text":"A leather-clad stranger shreds a solo so loud it stuns the room, then demands pyro.","reward":"Backstage Pass"},{"name":"The Sorority Ghost","text":"A glamorous ghost insists this is absolutely not the party she was promised, then points out a hidden door.","reward":"Ghostly Keycard"},{"name":"The Wisecracking Detective","text":"A private investigator looks at the blood, says he charges extra for dungeons, and keeps moving.","reward":"Case File"},{"name":"The Radio Lunatic","text":"A late-night radio voice hijacks the PA, insults the boss, and accidentally reveals a weak point.","reward":"Pirate Frequency"},{"name":"The Man in the Bad Suit","text":"A lounge-lizard hero offers one terrible pickup line, one excellent escape route, and zero context.","reward":"Polyester Luck"},{"name":"The Quiet Archer","text":"A hooded archer splits your target's arrow in midair, nods once, and disappears.","reward":"Split-Flight Arrow"},{"name":"The Appliance King","text":"A grinning salesman appears beside a refrigerator in a place with no electricity and somehow sells Milo a knife sharpener.","reward":"Lifetime Warranty Card"},{"name":"The Mystery Veteran","text":"A tired soldier checks your exit, gives Dane a nod, and tells Rex to stop standing in doorways.","reward":"Field Discipline Patch"},{"name":"The Cartoon Mascot","text":"A cheerful mascot wanders into a boss arena, realizes w const $=x=>document.getElementById(x),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rnd(0,a.length-1)],clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function fresh(){return {created:false,day:1,player:{name:"Crawler",className:"Ranger/Rogue",weapon:"Bow",trait:"Defiant",hp:24,maxHp:24,stam:20,maxStam:20,atk:8,crit:20,stealth:6,level:1,xp:0,gold:300,floor:1,rank:9999,viewers:1.2,fame:0,skill:0},party:PARTYBASE.map(x=>({...x,bond:0,hp:100})),inventory:[{name:"Starter Gear",rarity:"common",desc:"Barely legal as equipment."}],ach:[],completed:{},flags:{},quests:[],log:[],combat:null,tab:"story",sceneIndex:0,systems:{aiFavor:0,aiGrudge:0,exploit:0,club:null,god:null,sponsor:null,boxes:0,showWins:0,casinoDebt:0,lawWins:0,guideTrust:0,cameos:0,benefactor:null},ai:{fixation:null,last:"",interrupts:0},mordecai:{trust:0,notes:[]},quinn:{trust:0,cases:[]},lastAnnouncement:0};}
let S=fresh();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(t){$("toast").innerHTML='<div class="toast">'+t+'</div>';setTimeout(()=>$("toast").innerHTML="",3000)}
function log(t){S.log.unshift(t);S.log=S.log.slice(0,220)}
function save(silent=false){localStorage.setItem(SAVE_KEY,JSON.stringify(S));if(!silent)toast("Game saved.")}
function load(){let x=localStorage.getItem(SAVE_KEY);if(!x)return toast("No save found.");try{S=JSON.parse(x);render();story();toast("Save loaded.")}catch(e){toast("Save unreadable.")}}
function fmt(v){return v>=1000?(v/1000).toFixed(1)+"B":v.toFixed(v<100?1:0)+"M"}
function achieve(name,desc){if(S.ach.some(a=>a.name===name))return;S.ach.push({name,desc});S.player.fame+=2;S.player.viewers+=rnd(3,18);toast("<b>ACHIEVEMENT:</b> "+name+"<br><small>"+desc+"</small>");log("Achievement: "+name)}
function addItem(name,rarity="uncommon",desc=""){S.inventory.push({name,rarity,desc});toast("<b>"+rarity.toUpperCase()+"</b> "+name);log("Loot: "+name)}
function gainxp(n){S.player.xp+=n;while(S.player.xp>=S.player.level*100){S.player.xp-=S.player.level*100;S.player.level++;S.player.skill+=2;S.player.maxHp+=3;S.player.maxStam+=2;S.player.hp=S.player.maxHp;S.player.stam=S.player.maxStam;achieve("LEVEL UP, PROBABLY","You are now statistically harder to kill.")}}
function currentFloor(){return FLOORS[S.player.floor-1]}
function aiLine(ctx="scene"){let f=currentFloor(),pool=[...AI_POOL,...f.ai];if(S.player.weapon==="Bow"||S.player.className==="Ranger/Rogue")pool.push("The bow again. At this point it qualifies as a supporting character.","You found another weak point. I am shocked. Shocked.");if(S.systems.aiGrudge>4)pool.push("I remember that exploit. I also remember the timestamp.","Your file has a red tab now.");if(S.systems.aiFavor>4)pool.push("That was good television. Disturbingly good.","I may postpone one humiliation.");if(ctx==="boss")pool.push("BOSS ENCOUNTER. Please fail in an easily clipped format.","The boss has requested dramatic music. I chose something cheaper.");if(ctx==="show")pool.push("You are live. Fail photogenically.","Audience polling is open. I regret democracy.");if(S.ai.fixation)pool.push("Current fixation: "+S.ai.fixation+". This is now everyone's problem.");let l=pick(pool);if(l===S.ai.last)l=pick(pool);S.ai.last=l;S.ai.interrupts++;return l}
function mordecaiLine(extra=""){let f=currentFloor(),pool=[...MORD_POOL,`Floor ${f.n}: ${f.mechanic}.`,...(extra?[extra]:[])];S.mordecai.trust++;S.systems.guideTrust++;return pick(pool)}
function quinnLine(extra=""){let pool=[...QUINN_POOL,...(extra?[extra]:[])];S.quinn.trust++;S.systems.lawWins++;return pick(pool)}
function partyLine(){let p=pick(S.party);return `<b>${p.name}:</b> ${pick(p.banter)}`}
function dailyAnnouncement(force=false){if(!force&&S.lastAnnouncement===S.day)return"";S.lastAnnouncement=S.day;let deaths=rnd(42,640),leaders=rnd(2,9),floor=currentFloor();let sponsor=S.systems.sponsor?`Sponsor spotlight: ${S.systems.sponsor}.`:"Unclaimed crawlers remain commercially disappointing.";let txt=`<div class="announcement"><b>📢 DAILY DUNGEON ANNOUNCEMENT — DAY ${S.day}</b><br>${deaths} crawlers eliminated since last broadcast. ${leaders} leaderboard positions changed. Current hazard: <b>${floor.mechanic}</b>. ${sponsor}<br><br><b class="bad">KILL! KILL! KILL!</b></div>`;log("Daily announcement: "+deaths+" crawler deaths. KILL! KILL! KILL!");return txt}
function cameoMaybe(){if(S.flags["cameo"+S.player.floor])return"";if(Math.random()>.52)return"";S.flags["cameo"+S.player.floor]=1;let c=pick(CAMEOS);S.systems.cameos++;addItem(c.reward,"rare","A surprise cameo left this behind.");achieve("WAIT, WAS THAT...","A completely unexpected person wandered through your dungeon.");return `<div class="sceneCard"><b>🎭 SURPRISE CAMEO: ${c.name}</b><p>${c.text}</p><span class="pill">${c.reward}</span></div>`}
function nextScene(){let f=currentFloor();S.sceneIndex=(S.sceneIndex+1)%f.scenes.length;S.systems.aiFavor++;render();story()}
function nextDay(){S.day++;S.player.hp=Math.min(S.player.maxHp,S.player.hp+Math.ceil(S.player.maxHp*.35));S.player.stam=S.player.maxStam;dailyAnnouncement(true);render();story();save(true)}
function startCombat(kind="boss"){let f=currentFloor(),isBoss=kind==="boss",name=isBoss?f.boss:pick(["Tunnel Butcher","Sponsor Drone Pack","Contract Beast","Audience Favorite","Hazard Clerk","Mascot Assassin"]),hp=(isBoss?58:28)+S.player.floor*12;S.combat={name,hp,maxHp:hp,atk:5+S.player.floor*2,boss:isBoss,round:1,phase:0};render();combatView()}
function attack(mode="attack"){let c=S.combat;if(!c)return;let base=S.player.atk+rnd(1,8),crit=Math.random()*100<S.player.crit;if(mode==="skill"){if(S.player.stam<4)return toast("Not enough stamina.");S.player.stam-=4;base+=rnd(5,12);if(S.player.className==="Ranger/Rogue")base+=S.player.stealth;if(S.player.className==="Warden")S.player.hp=Math.min(S.player.maxHp,S.player.hp+4);if(S.player.className==="Hexer"&&Math.random()<.25)c.hp-=6}if(crit)base=Math.floor(base*1.8);c.hp-=base;let phase=Math.min(2,Math.floor((1-c.hp/c.maxHp)*3));if(phase>c.phase){c.phase=phase;toast("<b>BOSS PHASE:</b> "+currentFloor().bossPhases[phase])}log((crit?"CRIT ":"")+"Hit "+c.name+" for "+base);if(c.hp<=0)return winCombat();let incoming=Math.max(1,c.atk+rnd(-2,4)-Math.floor(S.player.level/2));if(Math.random()<.12+S.player.stealth*.01){log("Dodged "+c.name);incoming=0}S.player.hp-=incoming;c.round++;if(S.player.hp<=0)return death();render();combatView()}
function winCombat(){let c=S.combat,f=currentFloor();S.combat=null;S.player.gold+=c.boss?650+f.n*140:90+f.n*25;S.player.viewers+=c.boss?rnd(25,90):rnd(2,12);S.player.rank=Math.max(1,S.player.rank-(c.boss?rnd(150,520):rnd(5,40)));gainxp(c.boss?150+f.n*28:40+f.n*8);if(c.boss){S.completed[f.n]=true;addItem(pick(f.loot),f.n>11?"legendary":f.n>7?"epic":"rare","Boss drop from "+f.boss);achieve("FLOOR "+f.n+" CLEARED","You defeated "+f.boss+".");if(f.n<15){S.player.floor++;S.sceneIndex=0;S.day++;S.player.hp=S.player.maxHp;S.player.stam=S.player.maxStam;S.ai.fixation=pick(["your "+S.player.weapon,"Milo's pan","Quinn's objections","Mara's spear","doors","your habit of surviving"]);render();story();save(true)}else{ending()}}else{render();story()}}
function death(){S.combat=null;S.player.hp=Math.ceil(S.player.maxHp*.55);S.player.gold=Math.max(0,S.player.gold-150);S.systems.aiGrudge++;achieve("CONTENT SURVIVES","You died badly enough to become a replay package.");toast("Retry protocol triggered. The AI saved the footage.");render();story()}
function questChoice(i){let f=currentFloor(),q=f.quests[i],key="q"+f.n+"-"+i;if(S.flags[key])return toast("Already completed.");S.flags[key]=1;S.player.gold+=120+f.n*28;S.player.viewers+=rnd(5,18);gainxp(40+f.n*5);S.party[i%S.party.length].bond++;S.systems.aiFavor++;addItem(q.reward,f.n>10?"epic":"rare","Quest reward: "+q.name);log("Quest completed: "+q.name);render();story()}
function playShow(name){let sh=SHOWS.find(x=>x.name===name)||pick(SHOWS),win=Math.random()<.69;if(win){S.systems.showWins++;S.player.gold+=300+S.player.floor*35;S.player.viewers+=rnd(18,70);addItem("Audience Favor Token","rare","Won on "+sh.name);achieve("GOOD TELEVISION","Won "+sh.name+".")}else{S.player.hp=Math.max(1,S.player.hp-rnd(2,9));S.systems.aiGrudge++;toast("You lost "+sh.name+". The replay is trending.")}log("TV: "+sh.name+" — "+(win?"win":"loss"));render();story()}
function randomShow(){let sh=pick(SHOWS);playShow(sh.name)}
function joinClub(name){S.systems.club=name;achieve("CLUBBED","Joined "+name+". Rival club politics are now your problem.");render();systemsView()}
function chooseGod(name){S.systems.god=name;achieve("DIVINE PAPERWORK","Accepted the attention of "+name+".");render();systemsView()}
function chooseSponsor(name){S.systems.sponsor=name;S.systems.boxes++;S.player.gold+=550;achieve("SELLING OUT RESPONSIBLY","Signed with "+name+". Quinn has notes.");render();systemsView()}
function casino(){let bet=Math.min(100,S.player.gold);if(bet<25)return toast("Too broke for the casino to respect you.");S.player.gold-=bet;if(Math.random()<.47){S.player.gold+=bet*3;achieve("THE HOUSE BLINKED","Won a casino gamble.")}else{S.systems.casinoDebt+=bet;toast("The house wins. It sends regards.")}render();systemsView()}
function exploit(){S.systems.exploit++;S.systems.aiGrudge++;S.player.gold+=90;achieve("TECHNICALLY LEGAL","Used a dungeon wording exploit.");render();systemsView()}
function safeRoom(){let f=currentFloor();let s=pick(f.safe),m=pick(S.party);S.day++;S.player.hp=Math.min(S.player.maxHp,S.player.hp+Math.ceil(S.player.maxHp*.45));S.player.stam=S.player.maxStam;m.bond++;log("Safe room: "+s);render();$("content").innerHTML=`<div class="scene"><h2>Safe Room — Day ${S.day}</h2><div class="sceneCard">${s}</div><p class="partyline">${partyLine()}</p><p class="guide"><b>Mordecai:</b> ${mordecaiLine()}</p><p class="law"><b>Quinn:</b> ${quinnLine()}</p><div class="ai"><b>Dungeon AI:</b> ${aiLine()}</div><p><button class="tab" onclick="story()">Return to floor</button></p></div>`;save(true)}
function story(){S.tab="story";renderTabs();let f=currentFloor(),announce=dailyAnnouncement(),cameo=cameoMaybe(),scene=f.scenes[S.sceneIndex%f.scenes.length];let qs=f.quests.map((q,i)=>`<button class="choice" onclick="questChoice(${i})"><b>${S.flags["q"+f.n+"-"+i]?"✓ ":""}${q.name}</b><small>${q.desc}</small></button>`).join("");let showButtons=[f.show,pick(SHOWS).name].filter((v,i,a)=>a.indexOf(v)===i).map(x=>`<button class="choice" onclick="playShow(${JSON.stringify(x)})"><b>📺 ${x}</b><small>${(SHOWS.find(s=>s.name===x)||{desc:"Special broadcast event."}).desc}</small></button>`).join("");$("content").innerHTML=`<div class="scene">${announce}<div class="banner"><div class="big">FLOOR ${f.n}</div><h2>${f.name}</h2><small>${f.hook}</small></div>${cameo}<div class="sceneCard"><b>Current scene</b><p>${scene}</p><button class="tab" onclick="nextScene()">Advance scene</button></div><div class="ai"><b>Dungeon AI:</b> ${aiLine("scene")}</div><p class="guide"><b>Mordecai:</b> ${mordecaiLine()}</p><p class="law"><b>Quinn:</b> ${quinnLine()}</p><p class="partyline">${partyLine()}</p><h3>${f.npc}</h3><p>Floor mechanic: <b>${f.mechanic}</b>.</p><h3>Side quests</h3><div class="choices">${qs}</div><h3>Broadcasts</h3><div class="choices">${showButtons}<button class="choice" onclick="randomShow()"><b>📡 Random Network Segment</b><small>Could be trivia, cooking, obstacle chaos, Sponsor Smackdown, or the Penis Parade.</small></button></div><h3>Floor actions</h3><div class="choices"><button class="choice" onclick="startCombat('boss')"><b>⚔️ Challenge ${f.boss}</b><small>Three-phase boss encounter</small></button><button class="choice" onclick="safeRoom()"><b>🛏 Safe room</b><small>Rest, party banter, guide/lawyer scenes</small></button><button class="choice" onclick="nextDay()"><b>📢 Advance Day</b><small>New kill counts and KILL! KILL! KILL!</small></button><button class="choice" onclick="S.ai.fixation='your '+S.player.weapon;toast('The AI has noticed.');save(true)"><b>🎯 Feed AI fixation</b><small>Give the AI a recurring obsession</small></button></div></div>`}
function combatView(){S.tab="story";renderTabs();let c=S.combat;if(!c)return story();let f=currentFloor();$("content").innerHTML=`<div class="scene"><div class="banner"><div class="big">BOSS FEED</div><h2>${c.name}</h2><small>Round ${c.round}</small></div><div class="ai"><b>Dungeon AI:</b> ${aiLine("boss")}</div><div class="sceneCard"><b>Phase ${c.phase+1}:</b> ${f.bossPhases[c.phase]}</div><p><b>${c.name}</b> HP ${Math.max(0,c.hp)} / ${c.maxHp}</p><div class="bar"><i style="width:${clamp(c.hp/c.maxHp*100,0,100)}%"></i></div><p class="partyline">${partyLine()}</p><div class="choices"><button class="choice" onclick="attack('attack')"><b>Attack</b><small>Reliable damage</small></button><button class="choice" onclick="attack('skill')"><b>${CLASSES[S.player.className].perk}</b><small>Spend 4 stamina for class ability</small></button></div></div>`}
function partyView(){S.tab="party";renderTabs();$("content").innerHTML='<div class="section"><h2>Party</h2>'+S.party.map(p=>`<div class="item"><b>${p.name}</b> <span class="pill">${p.gear}</span><p>${p.role}</p><p class="muted">“${pick(p.banter)}”</p><small>Bond ${p.bond} • Condition ${p.hp}%</small></div>`).join("")+'<div class="item"><b>Mordecai</b><p>Guide, rules interpreter, build adviser, old-crawler knowledge, hidden mechanics, floor warnings.</p><small>Trust '+S.mordecai.trust+'</small></div><div class="item"><b>Quinn</b><p>Attorney, sponsor contracts, production traps, surrender clauses, appeals, evidence, loopholes.</p><small>Trust '+S.quinn.trust+' • Cases '+S.systems.lawWins+'</small></div></div>'}
function inventoryView(){S.tab="inventory";renderTabs();$("content").innerHTML='<div class="section"><h2>Inventory</h2>'+S.inventory.map(x=>`<div class="item"><b>${x.name}</b> <span class="pill">${x.rarity}</span><p>${x.desc||""}</p></div>`).join("")+'</div>'}
function systemsView(){S.tab="systems";renderTabs();$("content").innerHTML=`<div class="section"><h2>Systems</h2><div class="item"><b>Clubs</b><p>${S.systems.club||"None"}</p>${CLUBS.map(x=>`<button class="tab" onclick="joinClub('${x}')">${x}</button>`).join(" ")}</div><div class="item"><b>Gods</b><p>${S.systems.god||"No patron"}</p>${GODS.map(x=>`<button class="tab" onclick="chooseGod('${x.replace(/'/g,"\\'")}')">${x}</button>`).join(" ")}</div><div class="item"><b>Sponsors</b><p>${S.systems.sponsor||"Unsigned"}</p>${SPONSORS.map(x=>`<button class="tab" onclick="chooseSponsor('${x}')">${x}</button>`).join(" ")}</div><div class="item"><b>Casino</b><p>Debt ${S.systems.casinoDebt}g</p><button class="tab" onclick="casino()">Bet up to 100g</button></div><div class="item"><b>Dungeon exploits</b><p>Exploit count ${S.systems.exploit} • AI grudge ${S.systems.aiGrudge}</p><button class="tab" onclick="exploit()">Use wording loophole</button></div><div class="item"><b>Dungeon AI</b><p>Favor ${S.systems.aiFavor} • Grudge ${S.systems.aiGrudge} • Interruptions ${S.ai.interrupts}<br>Fixation: ${S.ai.fixation||"none"}</p></div><div class="item"><b>Daily announcements</b><p>Every new day brings crawler death counts, ranking movement, sponsor notices, floor hazards, and the traditional <b class="bad">KILL! KILL! KILL!</b></p><button class="tab" onclick="nextDay()">Advance day</button></div></div>`}
function floorsView(){S.tab="floors";renderTabs();$("content").innerHTML='<div class="section"><h2>15-Floor Campaign</h2><div class="floorgrid">'+FLOORS.map(f=>`<div class="floor ${f.n===S.player.floor?"now":S.completed[f.n]?"done":f.n>S.player.floor?"lock":""}"><b>${f.n}. ${f.name}</b><br><small>${f.boss}</small><br><span class="pill">${f.mechanic}</span><p class="muted">${f.hook}</p></div>`).join("")+'</div></div>'}
function achievementsView(){S.tab="ach";renderTabs();$("content").innerHTML='<div class="section"><h2>Achievements</h2>'+(S.ach.length?S.ach.map(a=>`<div class="item"><b>${a.name}</b><p>${a.desc}</p></div>`).join(""):'<p class="muted">No achievements yet. Embarrassing.</p>')+'</div>'}
function logView(){S.tab="log";renderTabs();$("content").innerHTML='<div class="section"><h2>Broadcast Log</h2><div class="log">'+S.log.map(x=>'<div class="logrow">'+esc(x)+'</div>').join("")+'</div></div>'}
function saveView(){S.tab="save";renderTabs();$("content").innerHTML=`<div class="section"><h2>Save / Load</h2><div class="choices"><button class="choice" onclick="save()"><b>Save game</b></button><button class="choice" onclick="load()"><b>Load game</b></button><button class="choice" onclick="exportSave()"><b>Export save</b></button><button class="choice" onclick="if(confirm('Reset entire campaign?')){localStorage.removeItem(SAVE_KEY);location.reload()}"><b>Reset campaign</b></button></div></div>`}
function exportSave(){let blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="broadcast-dungeon-save.json";a.click();URL.revokeObjectURL(a.href)}
function ending(){S.completed[15]=true;S.player.rank=1;S.player.viewers+=1000;achieve("FINAL CUT","You reached the end of the fifteen-floor broadcast.");render();$("content").innerHTML=`<div class="scene"><div class="banner"><div class="big">FINALE</div><h2>The Last Studio</h2></div><div class="ai"><b>Dungeon AI:</b> I prepared several endings. Naturally, you complicated all of them.</div><p class="guide"><b>Mordecai:</b> You made it. Whatever happens next, make sure it is your choice.</p><p class="law"><b>Quinn:</b> I have three exit clauses, two lawsuits, and one truly offensive settlement proposal.</p><p class="partyline">${partyLine()}</p><div class="choices"><button class="choice" onclick="finalChoice('break')"><b>Break the format</b><small>Destroy the broadcast contract and walk</small></button><button class="choice" onclick="finalChoice('win')"><b>Win inside the rules</b><small>Take Rank #1 and force production to honor the contract</small></button><button class="choice" onclick="finalChoice('party')"><b>Choose the party</b><small>Trade fame for everyone's safe extraction</small></button><button class="choice" onclick="finalChoice('ai')"><b>Cut the AI in</b><small>Offer the Dungeon AI a deal nobody anticipated</small></button></div></div>`}
function finalChoice(x){let map={break:"You shatter the format and leave production arguing with its own terms.",win:"You win the show on its own rules and Quinn makes them pay every clause.",party:"The party walks out together. Ratings fall. Nobody cares.",ai:"The Dungeon AI laughs for eleven straight seconds and opens a door production did not know existed."};S.flags.ending=x;save(true);$("content").innerHTML=`<div class="scene"><h1>THE END</h1><p>${map[x]}</p><div class="announcement"><b>FINAL ANNOUNCEMENT:</b><br>Rank #1. Party status: alive. Contract status: disputed.<br><br><b class="bad">KILL! KILL! KILL!</b></div><p><button class="tab" onclick="floorsView()">View campaign record</button></p></div>`}
function renderTabs(){let tabs=[["story","Story","story()"],["party","Party","partyView()"],["inventory","Inventory","inventoryView()"],["systems","Systems","systemsView()"],["floors","Floors","floorsView()"],["ach","Achievements","achievementsView()"],["log","Log","logView()"],["save","Save","saveView()"]];$("tabs").innerHTML=tabs.map(t=>`<button class="tab ${S.tab===t[0]?"on":""}" onclick="${t[2]}">${t[1]}</button>`).join("")}
function render(){let p=S.player;$("dayChip").textContent="Day "+S.day;$("floorChip").textContent="Floor "+p.floor;$("rankChip").textContent="Rank #"+p.rank;$("viewerChip").textContent=fmt(p.viewers)+" viewers";$("goldChip").textContent=p.gold+"g";$("side").innerHTML=`<div class="portrait">${WEAPONS[p.weapon].icon}</div><div class="name">${esc(p.name)}</div><div class="sub">${p.className} • ${p.weapon} • Lv ${p.level}</div><small>HP ${p.hp}/${p.maxHp}</small><div class="bar"><i style="width:${clamp(p.hp/p.maxHp*100,0,100)}%"></i></div><small>Stamina ${p.stam}/${p.maxStam}</small><div class="bar st"><i style="width:${clamp(p.stam/p.maxStam*100,0,100)}%"></i></div><div class="stats"><div class="stat"><b>${p.atk}</b><small>Attack</small></div><div class="stat"><b>${p.crit}%</b><small>Crit</small></div><div class="stat"><b>${p.stealth}</b><small>Stealth</small></div><div class="stat"><b>${p.fame}</b><small>Fame</small></div></div><p class="sub">Trait: ${p.trait}<br>Club: ${S.systems.club||"none"}<br>God: ${S.systems.god||"none"}<br>Sponsor: ${S.systems.sponsor||"none"}</p>`;renderTabs()}
function creator(){let selected="Ranger/Rogue";$("modal").innerHTML=`<div class="modal"><div class="modalbox"><h1>Create Your Crawler</h1><div class="creator"><label class="field">Name<input id="cname" value="Crawler"></label><label class="field">Starting weapon<select id="cweapon">${Object.keys(WEAPONS).map(x=>`<option>${x}</option>`).join("")}</select></label><label class="field">Trait<select id="ctrait"><option>Defiant</option><option>Greedy</option><option>Protective</option><option>Showboat</option><option>Suspicious</option><option>Lucky</option></select></label></div><h3>Class path</h3><div class="classgrid">${Object.keys(CLASSES).map((x,i)=>`<button class="classcard ${i===0?"on":""}" data-c="${x}"><b>${x}</b><br><small>${CLASSES[x].desc}<br>${CLASSES[x].perk}</small></button>`).join("")}</div><p><button class="choice" id="begin"><b>ENTER THE DUNGEON</b><small>15 floors. Persistent party, Mordecai, Quinn, Dungeon AI, sponsors, gods, clubs, casino, TV, cameos, daily announcements, multiple endings.</small></button></p></div></div>`;document.querySelectorAll(".classcard").forEach(b=>b.onclick=()=>{selected=b.dataset.c;document.querySelectorAll(".classcard").forEach(x=>x.classList.remove("on"));b.classList.add("on")});$("begin").onclick=()=>{let c=CLASSES[selected],w=$("cweapon").value,wb=WEAPONS[w];S=fresh();S.created=true;Object.assign(S.player,{name:$("cname").value.trim()||"Crawler",className:selected,weapon:w,trait:$("ctrait").value,hp:c.hp,maxHp:c.hp,stam:c.stam,maxStam:c.stam,atk:c.atk+wb.atk,crit:c.crit+wb.crit,stealth:c.stealth});$("modal").innerHTML="";achieve("WELCOME, CRAWLER","You signed nothing and somehow agreed to everything.");log("Dungeon AI: "+aiLine("scene"));save(true);render();story()}}
window.onerror=(m,s,l,c,e)=>{toast("<b>Game error:</b> "+esc(m));console.error(e||m)};
render();if(!S.created){let saved=localStorage.getItem(SAVE_KEY);if(saved){try{S=JSON.parse(saved);if(S.created){render();story()}else creator()}catch(e){creator()}}else creator()}else story();
</script></body></html>
