<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#101018" />
<title>Broadcast Dungeon: Black Bow</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#171a22; --panel2:#202431; --text:#f4f6fb;
    --muted:#aeb6c7; --accent:#7dd3fc; --good:#86efac; --warn:#facc15;
    --bad:#f87171; --violet:#c4b5fd; --gold:#f5d06f; --line:#343a4a;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:radial-gradient(circle at top,#171b28,#0d0f14 45%);
    color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    min-height:100vh;
  }
  #app{max-width:1100px;margin:auto;padding:14px 14px 70px}
  h1,h2,h3{line-height:1.05;margin:.35em 0}
  h1{font-size:clamp(2rem,7vw,4rem);letter-spacing:-.04em}
  h2{font-size:clamp(1.55rem,5vw,2.55rem)}
  h3{font-size:clamp(1.25rem,4vw,1.7rem)}
  p,button,.stat,.chip,.log{font-size:clamp(1rem,3.6vw,1.16rem)}
  .topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .chip{padding:7px 11px;background:#111520;border:1px solid var(--line);border-radius:999px}
  .grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
  @media(max-width:800px){.grid{grid-template-columns:1fr}}
  .panel{background:linear-gradient(180deg,var(--panel),#12151c);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 12px 35px #0006}
  .scene{min-height:420px}
  .sidebar{display:flex;flex-direction:column;gap:14px}
  .choices{display:grid;gap:10px;margin-top:16px}
  button{
    width:100%;text-align:left;border:1px solid #46506a;background:#252b3a;color:var(--text);
    border-radius:14px;padding:14px 16px;font-weight:700;cursor:pointer;touch-action:manipulation
  }
  button:hover{background:#30384c}
  button.primary{background:#17455d;border-color:#2585b3}
  button.good{background:#17452b;border-color:#2d8550}
  button.bad{background:#5c2222;border-color:#a63d3d}
  button.gold{background:#5a4317;border-color:#aa812c}
  .smallbtn{width:auto;padding:8px 10px;font-size:.92rem}
  .statrow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .stat{background:#111520;border:1px solid var(--line);padding:10px;border-radius:12px}
  .bar{height:11px;background:#090b0f;border-radius:99px;overflow:hidden;border:1px solid #2c3240}
  .bar > span{display:block;height:100%;background:linear-gradient(90deg,#7dd3fc,#86efac)}
  .danger > span{background:linear-gradient(90deg,#fb7185,#f87171)}
  .goldtxt{color:var(--gold)} .goodtxt{color:var(--good)} .badtxt{color:var(--bad)}
  .violet{color:var(--violet)} .muted{color:var(--muted)}
  .log{max-height:260px;overflow:auto;background:#0a0c11;border-radius:12px;padding:10px;border:1px solid #272c38}
  .log div{padding:7px 4px;border-bottom:1px solid #20242e}
  .inventory{display:grid;gap:6px}
  .item{padding:9px;background:#111520;border-radius:10px;border:1px solid #2f3544}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .tabs button{width:auto}
  .hidden{display:none!important}
  .ai{border-left:4px solid #f472b6;padding-left:12px}
  .achievement{border:1px solid #8b5cf6;background:#251a3c;padding:12px;border-radius:14px}
  .tv{border:1px solid #22d3ee;background:#0f2830;padding:12px;border-radius:14px}
  .footer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .footer-actions button{width:auto}
  .kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#090b10;border:1px solid #333949;border-radius:6px;padding:2px 6px}

  .artcard,.portraitcard,.objectivecard{background:#0f1320;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 24px #0005}
  .scene-art{margin:8px 0 14px}
  .artmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 12px;background:#0d1118;border-top:1px solid #242a37}
  .arttag{padding:5px 9px;border-radius:999px;background:#182030;border:1px solid #314159;font-size:.92rem;color:#d4ddf0}
  .portrait-top{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}
  @media(max-width:420px){.portrait-top{grid-template-columns:1fr}}
  .portrait-meta{display:grid;gap:8px}
  .subchips{display:flex;gap:6px;flex-wrap:wrap}
  .objlist{display:grid;gap:8px;padding:12px}
  .objitem{padding:10px;background:#111725;border:1px solid #2a3550;border-radius:12px}
  .item b small{opacity:.8}
  .rarity-chip{display:inline-block;padding:3px 8px;border-radius:999px;font-size:.82rem;margin-bottom:6px;border:1px solid #3a4152}
  .r-Common{background:#18202b}.r-Uncommon{background:#173022;color:#cbffd9}.r-Rare{background:#18294f;color:#d2e3ff}.r-Mythic{background:#3c1846;color:#f0d5ff}.r-Ascendant{background:#4a3b12;color:#fff1bc}.r-Legendary{background:#453313;color:#ffe1a1}
  .partycards{display:grid;gap:8px}
  .p-card{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;padding:10px;background:#111520;border-radius:12px;border:1px solid #2f3544}
  .mini{width:52px;height:52px;border-radius:12px;overflow:hidden;border:1px solid #394157;background:#090d14}
  .scanlines{position:relative}
  .scanlines:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 0,rgba(255,255,255,.02) 50%,transparent 100%);background-size:100% 5px;pointer-events:none;mix-blend-mode:screen}
  .kv{display:flex;justify-content:space-between;gap:8px}

</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="chip">🎯 <b id="rankChip">Rank #43</b></div>
    <div class="chip">👁 <b id="viewChip">18.7M viewers</b></div>
    <div class="chip">💰 <b id="goldChip">2,500 gold</b></div>
    <div class="chip">🏹 <b id="floorChip">Floor 1</b></div>
  </div>

  <div class="grid">
    <main class="panel scene">
      <h1>Broadcast Dungeon</h1>
      <div id="sceneVisual" class="scene-art"></div>
      <div id="scene"></div>
      <div id="choices" class="choices"></div>
      <div class="footer-actions">
        <button class="smallbtn" onclick="saveGame()">💾 Save</button>
        <button class="smallbtn" onclick="loadGame()">📥 Load</button>
        <button class="smallbtn" onclick="exportSave()">📤 Export Save</button>
        <button class="smallbtn" onclick="resetGame()">♻️ New Run</button>
      </div>
    </main>

    <aside class="sidebar">
      <section class="panel">
        <div id="heroCard"></div>
        <h2>Black Bow</h2>
        <div class="statrow">
          <div class="stat">Level <b id="lvl">1</b></div>
          <div class="stat">XP <b id="xp">0</b></div>
          <div class="stat">HP <b id="hptext">30/30</b><div class="bar danger"><span id="hpbar" style="width:100%"></span></div></div>
          <div class="stat">Stamina <b id="stamtext">20/20</b><div class="bar"><span id="stambar" style="width:100%"></span></div></div>
          <div class="stat">Attack <b id="atk">6</b></div>
          <div class="stat">Crit <b id="crit">12%</b></div>
          <div class="stat">Stealth <b id="stealth">5</b></div>
          <div class="stat">Fame <b id="fame">0</b></div>
        </div>
      </section>

      <section class="panel">
        <h3>Objective</h3>
        <div id="objectiveCard"></div>
      </section>

      <section class="panel">
        <div class="tabs">
          <button class="smallbtn" onclick="showTab('gear')">Gear</button>
          <button class="smallbtn" onclick="showTab('party')">Party</button>
          <button class="smallbtn" onclick="showTab('systems')">Systems</button>
        </div>
        <div id="gearTab"></div>
        <div id="partyTab" class="hidden"></div>
        <div id="systemsTab" class="hidden"></div>
      </section>

      <section class="panel">
        <h3>Dungeon Feed</h3>
        <div id="log" class="log"></div>
      </section>
    </aside>
  </div>
</div>

<script>
const VERSION = "1.0.0";

const state = {
  version: VERSION,
  player:{
    name:"Black Bow", level:1, xp:0, hp:30, maxHp:30, stamina:20, maxStamina:20,
    attack:6, crit:12, stealth:5, fame:0, gold:2500, viewers:18.7, rank:43,
    floor:1, location:"safe", weapon:"Ashstring Bow", armor:"Patchwork Shadowcoat",
    class:"Ranger/Rogue", god:null, club:null
  },
  inventory:[
    {name:"Ashstring Bow",type:"weapon",rarity:"Rare",desc:"+2 ranged damage; quiet draw."},
    {name:"Patchwork Shadowcoat",type:"armor",rarity:"Uncommon",desc:"+2 stealth."},
    {name:"Second-Chance Token",type:"consumable",rarity:"Rare",desc:"Reroll one catastrophic failure."}
  ],
  party:[],
  flags:{
    intro:false, firstKill:false, metMara:false, clubPass:false, godSeen:false,
    sponsor:false, tv:false, cookbook:false, casino:false, penisParade:false,
    floorBoss:false, currentCombat:null, gameShow:false, faction:false, benefactor:false
  },
  systems:{
    achievements:[], quests:[], sponsors:[], gods:[], clubs:[],
    fanBoxes:0, sponsorBoxes:0, celestialBoxes:0, benefactors:[],
    audienceFavor:0, aiFixation:"dramatic bow shots"
  },
  log:[]
};

const enemies = {
  sewerGnawer:{name:"Sewer Gnawer",hp:18,maxHp:18,atk:5,xp:40,gold:[25,55],boss:false},
  bladeCollector:{name:"Blade Collector",hp:38,maxHp:38,atk:8,xp:90,gold:[80,140],boss:true},
  glassJackal:{name:"Glass Jackal Sniper",hp:32,maxHp:32,atk:10,xp:110,gold:[110,180],boss:false},
  cathedralMaw:{name:"Cathedral Maw",hp:85,maxHp:85,atk:13,xp:220,gold:[250,420],boss:true}
};

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function fmtView(v){return v>=1000?(v/1000).toFixed(1)+"B":v.toFixed(v<100?1:0)+"M"}
function log(msg){state.log.unshift(msg); state.log=state.log.slice(0,35); renderLog();}
function achievement(name,desc){
  if(state.systems.achievements.some(a=>a.name===name)) return;
  state.systems.achievements.push({name,desc});
  state.player.fame+=2; state.player.viewers+=rnd(2,8);
  log("🏆 ACHIEVEMENT: "+name+" — "+desc);
}
function addItem(name,type,rarity,desc){
  state.inventory.push({name,type,rarity,desc}); log("🎁 Loot: "+rarity+" "+name);
}
function addQuest(name,desc,reward){
  if(!state.systems.quests.some(q=>q.name===name)) state.systems.quests.push({name,desc,reward,done:false});
}
function update(){
  const p=state.player;
  document.getElementById("rankChip").textContent="Rank #"+p.rank;
  document.getElementById("viewChip").textContent=fmtView(p.viewers)+" viewers";
  document.getElementById("goldChip").textContent=p.gold.toLocaleString()+" gold";
  document.getElementById("floorChip").textContent="Floor "+p.floor;
  ["lvl","xp","atk","stealth","fame"].forEach(id=>document.getElementById(id).textContent=p[id==="lvl"?"level":id]);
  document.getElementById("crit").textContent=p.crit+"%";
  document.getElementById("hptext").textContent=p.hp+"/"+p.maxHp;
  document.getElementById("stamtext").textContent=p.stamina+"/"+p.maxStamina;
  document.getElementById("hpbar").style.width=(100*p.hp/p.maxHp)+"%";
  document.getElementById("stambar").style.width=(100*p.stamina/p.maxStamina)+"%";
  renderTabs(); renderLog(); renderHeroCard(); renderObjectiveCard(); renderSceneVisual();
}
function renderLog(){
  document.getElementById("log").innerHTML=state.log.map(x=>"<div>"+x+"</div>").join("");
}
function rarityChip(r){return `<span class="rarity-chip r-${r}">${r}</span>`}
function memberSVG(kind){
  const map={
    hero:['#89d6ff','#0f2437'], mara:['#ffd66b','#39210f'], rex:['#ff8b8b','#351414'], dane:['#b8ffcb','#143322'], tessa:['#d9b4ff','#26153d'], milo:['#ffe4a8','#3c2a12'], quinn:['#cdd6e7','#20283b']
  };
  const c=map[kind]||map.hero;
  return `<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></linearGradient></defs><rect width="100" height="100" fill="#0b1018"/><circle cx="50" cy="34" r="16" fill="url(#g)"/><path d="M24 88c4-20 15-28 26-28s22 8 26 28" fill="url(#g)"/><path d="M20 24l30-16 30 16-7 7-23-12-23 12z" fill="#0a0f16" opacity=".75"/></svg>`;
}
function renderHeroCard(){
  const p=state.player;
  document.getElementById("heroCard").innerHTML = `
    <div class="portraitcard scanlines">
      <div class="portrait-top" style="padding:12px;">
        <div class="mini" style="width:120px;height:120px;border-radius:16px;">${memberSVG('hero')}</div>
        <div class="portrait-meta">
          <div><h3 style="margin:0">${p.name}</h3><div class="muted">${p.class}</div></div>
          <div class="subchips">
            <span class="arttag">🏹 ${p.weapon}</span>
            <span class="arttag">🧥 ${p.armor}</span>
            <span class="arttag">🙏 ${p.god||'No god'}</span>
            <span class="arttag">♣ ${p.club||'No club'}</span>
          </div>
          <div class="kv"><span class="muted">Sponsor</span><b>${state.systems.sponsors.map(s=>s.name).join(', ')||'None'}</b></div>
          <div class="kv"><span class="muted">Boxes</span><b>${state.systems.fanBoxes} fan / ${state.systems.celestialBoxes} celestial</b></div>
        </div>
      </div>
    </div>`;
}
function currentSceneTitle(){ const el=document.querySelector('#scene h2'); return el?el.textContent.trim():`Floor ${state.player.floor}` }
function artSVG(theme,title){
  const themes={
    underworks:['#0b1220','#14304e','#5ac8fa'], safe:['#111827','#24324a','#86efac'], club:['#220f24','#4a164d','#ff7be6'], casino:['#1d1810','#584315','#ffd166'], gods:['#161725','#3b2b59','#d7c0ff'], cathedral:['#0f1420','#2f3648','#8be9fd'], city:['#11141d','#1f2f49','#7dd3fc'], combat:['#1a1117','#4a2028','#ff7c7c'], tv:['#0b1e28','#0d4862','#60e3ff']
  };
  const c=themes[theme]||themes.safe;
  const towers = theme==='city'||theme==='combat'||theme==='tv';
  const arches = theme==='cathedral';
  return `<div class="artcard scanlines"><svg viewBox="0 0 900 250" width="100%" height="220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${c[1]}"/><stop offset="1" stop-color="${c[0]}"/></linearGradient><radialGradient id="moon" cx="70%" cy="28%"><stop stop-color="${c[2]}" stop-opacity=".95"/><stop offset="1" stop-color="${c[2]}" stop-opacity="0"/></radialGradient></defs><rect width="900" height="250" fill="url(#bg)"/><circle cx="640" cy="70" r="58" fill="url(#moon)"/>${towers?`<rect x="60" y="150" width="80" height="60" fill="#0b0f16"/><rect x="180" y="130" width="55" height="80" fill="#0b0f16"/><rect x="240" y="90" width="80" height="120" fill="#0b0f16"/><rect x="340" y="120" width="40" height="90" fill="#0b0f16"/><rect x="420" y="80" width="90" height="130" fill="#0b0f16"/><rect x="540" y="110" width="60" height="100" fill="#0b0f16"/><rect x="630" y="60" width="70" height="150" fill="#0b0f16"/>`:''}${arches?`<path d="M40 210h130V95l-25-20-25 20v80H90v-46H70v81zm180 0h130V95l-25-20-25 20v80h-30v-46h-20v81zm180 0h130V95l-25-20-25 20v80h-30v-46h-20v81z" fill="#0a0e15"/>`:''}${theme==='underworks'?`<path d="M0 180C70 150 120 170 200 150s120 30 200 10 140-20 220 10 170 20 280 0v80H0z" fill="#0a0f16"/><circle cx="150" cy="145" r="22" fill="#5ac8fa" opacity=".25"/><circle cx="245" cy="165" r="8" fill="#5ac8fa" opacity=".35"/>`:''}${theme==='safe'?`<path d="M0 170h900v80H0z" fill="#0a0f16"/><rect x="180" y="100" width="120" height="90" rx="8" fill="#121a26" stroke="#3c556b"/><rect x="340" y="80" width="140" height="110" rx="8" fill="#121a26" stroke="#3c556b"/><rect x="530" y="100" width="120" height="90" rx="8" fill="#121a26" stroke="#3c556b"/>`:''}${theme==='club'?`<path d="M0 170h900v80H0z" fill="#0b0710"/><circle cx="160" cy="88" r="8" fill="#ff7be6"/><circle cx="205" cy="96" r="6" fill="#7dd3fc"/><circle cx="245" cy="82" r="10" fill="#ffd166"/><rect x="560" y="75" width="120" height="95" rx="10" fill="#2a1230" stroke="#6d3573"/><text x="620" y="130" font-size="36" text-anchor="middle" fill="#ff93ee" font-family="Arial">CLUB</text>`:''}${theme==='casino'?`<path d="M0 170h900v80H0z" fill="#0b0710"/><rect x="160" y="85" width="170" height="90" rx="10" fill="#2f2514" stroke="#8c6a1e"/><text x="245" y="140" font-size="40" text-anchor="middle" fill="#ffd166" font-family="Arial">777</text><circle cx="640" cy="118" r="50" fill="#2f2514" stroke="#8c6a1e"/><text x="640" y="130" font-size="28" text-anchor="middle" fill="#ffd166" font-family="Arial">$</text>`:''}${theme==='gods'?`<path d="M0 175h900v75H0z" fill="#0c1018"/><path d="M120 195l40-90 40 90zm150 0l40-110 40 110zm180 0l40-80 40 80zm180 0l40-120 40 120z" fill="#181d2a" stroke="#7e6aa9"/>`:''}<path d="M0 205c80-25 160-5 250-18s155-40 250-25 190 30 400-6v94H0z" fill="#06080c" opacity=".92"/><path d="M110 205c26-36 44-65 60-65 15 0 34 28 58 65" fill="#0d1520" stroke="#7dd3fc" stroke-opacity=".45"/><circle cx="140" cy="92" r="4" fill="#fff" opacity=".7"/><circle cx="300" cy="48" r="2" fill="#fff" opacity=".45"/><circle cx="525" cy="36" r="3" fill="#fff" opacity=".5"/><circle cx="760" cy="55" r="2" fill="#fff" opacity=".42"/></svg><div class="artmeta"><span class="arttag">${title}</span><span class="arttag">👁 ${fmtView(state.player.viewers)} viewers</span><span class="arttag">🎯 Rank #${state.player.rank}</span></div></div>`;
}
function inferTheme(t){
  t=t.toLowerCase();
  if(t.includes('casino')) return 'casino';
  if(t.includes('club')||t.includes('lantern')) return 'club';
  if(t.includes('shrine')||t.includes('hall of petitioned')||t.includes('ivory standard')) return 'gods';
  if(t.includes('broadcast')||t.includes('last shot')||t.includes('showcase')||t.includes('trivia')||t.includes('wheel')||t.includes('panic kitchen')) return 'tv';
  if(t.includes('cathedral')) return 'cathedral';
  if(t.includes('city')||t.includes('safe room hub')) return state.player.floor>=3?'city':'safe';
  if(t.includes('collector')||t.includes('combat')||t.includes('glass')||t.includes('fight')||state.flags.currentCombat) return 'combat';
  if(t.includes('drainage')||t.includes('underworks')) return 'underworks';
  if(t.includes('safe room')) return 'safe';
  return state.player.floor===1?'underworks':state.player.floor===2?'cathedral':state.player.floor>=3?'city':'safe';
}
function renderSceneVisual(){
  const title=currentSceneTitle();
  document.getElementById('sceneVisual').innerHTML = artSVG(inferTheme(title), title);
}
function nextObjective(){
  if(state.flags.currentCombat) return ['Win the fight', 'Defeat '+state.flags.currentCombat.name+' and survive the counterattack.'];
  if(state.player.floor===1 && !state.flags.firstKill) return ['Enter the dungeon','Survive your first encounter in the Underworks.'];
  if(state.player.floor===1 && !state.flags.metMara) return ['Choose an ally','Free Mara or continue alone.'];
  if(state.player.floor<2) return ['Claim the black bow','Defeat the Blade Collector and take the bonded weapon.'];
  if(state.player.floor===2 && !state.flags.floorBoss) return ['Explore the hub','Use clubs, casino, gods, and TV shows before tackling Floor 2.'];
  if(state.player.floor===2) return ['Reach Floor 3','Use safe-room systems, then push into the City of Teeth.'];
  if(state.player.floor===3 && !state.flags.gameShow) return ['Build fame','Use broadcasts, sponsors, and evidence to control the narrative.'];
  if(state.player.floor===3) return ['Handle The Last Shot','Secure Crow alive and expose the producer angle.'];
  return ['Push deeper','Floor 4 systems can now be expanded from this save.'];
}
function renderObjectiveCard(){
  const [title,desc]=nextObjective();
  document.getElementById('objectiveCard').innerHTML = `<div class="objectivecard"><div class="objlist"><div class="objitem"><b>${title}</b><div class="muted">${desc}</div></div><div class="objitem"><div class="kv"><span class="muted">Achievements</span><b>${state.systems.achievements.length}</b></div><div class="kv"><span class="muted">Active sponsor</span><b>${state.systems.sponsors[0]?.name||'None'}</b></div><div class="kv"><span class="muted">Club / God</span><b>${state.player.club||'—'} / ${state.player.god||'—'}</b></div></div></div></div>`;
}
function renderTabs(){
  document.getElementById("gearTab").innerHTML=
    `<div class="inventory"><div class="item"><b>🏹 ${state.player.weapon}</b><br><span class="muted">${state.player.class}</span></div>
    <div class="item"><b>🧥 ${state.player.armor}</b></div>`+
    state.inventory.map(i=>`<div class="item">${rarityChip(i.rarity)}<br><b>${i.name}</b><br><span class="muted">${i.desc}</span></div>`).join("")+"</div>";
  document.getElementById("partyTab").innerHTML= state.party.length

function gainXP(n){
  state.player.xp+=n;
  while(state.player.xp>=state.player.level*100){
    state.player.xp-=state.player.level*100; state.player.level++;
    state.player.maxHp+=8; state.player.hp=state.player.maxHp;
    state.player.maxStamina+=4; state.player.stamina=state.player.maxStamina;
    state.player.attack+=2; state.player.stealth+=1; state.player.crit+=1;
    achievement("LEVEL UP, APPARENTLY","You survived long enough to become statistically more annoying.");
  }
}
function lootRoll(boss=false){
  const r=Math.random();
  if(boss && r>.82){
    addItem("Moonwire Bowstring","relic","Mythic","+2 damage; crit kills refund 2 stamina.");
    state.player.attack+=2; state.player.crit+=2;
  }else if(r>.70){
    addItem("Ghoststep Greaves","armor","Rare","+2 stealth; ignore rough terrain.");
    state.player.stealth+=2;
  }else if(r>.45){
    addItem("Hunter's Focus","consumable","Rare","+3 ranged attack for one fight.");
  }else{
    const weird=["Enchanted Rubber Chicken","Self-Warming Sock","Cursed Coupon Book","Portable Applause Sign"];
    const w=weird[rnd(0,weird.length-1)];
    addItem(w,"oddity","Uncommon","Probably useless. Which means it will become important later.");
  }
}
function combatStart(key, after){
  const base=enemies[key]; state.flags.currentCombat={...base,key,after};

}
function combatRender(msg=""){
  const e=state.flags.currentCombat, p=state.player;
  if(!e) return;
  scene(`
    <h2>⚔️ ${e.name}</h2>
    ${msg?`<p>${msg}</p>`:""}
    <p><b>Enemy HP:</b> ${e.hp}/${e.maxHp}</p>
    <div class="bar danger"><span style="width:${100*e.hp/e.maxHp}%"></span></div>
    <p class="ai"><b>Dungeon AI:</b> ${e.boss?"A boss fight. Try not to die somewhere visually inconvenient.":"Violence detected. Viewer retention improving."}</p>`,
    [
      {label:"🏹 Aim for weak point",action:"attackEnemy('aim')",cls:"primary"},
      {label:"🌑 Fade into stealth",action:"attackEnemy('stealth')"},
      {label:"🏃 Reposition",action:"attackEnemy('move')"},
      ...(p.hp<15?[{label:"🧪 Emergency heal",action:"attackEnemy('heal')",cls:"good"}]:[])
    ]);
}
function attackEnemy(mode){
  const e=state.flags.currentCombat,p=state.player;if(!e)return;
  let dmg=rnd(Math.max(2,p.attack-2),p.attack+5), note="";
  if(mode==="aim"){dmg+=4; if(Math.random()*100<p.crit){dmg*=2; note=" CRITICAL.";}}
  if(mode==="stealth"){ if(Math.random()<0.72){dmg+=6; note=" You vanish and fire from a new angle."} else note=" Your stealth transition gets spotted."; }
  if(mode==="move"){p.stamina=Math.max(0,p.stamina-2); if(Math.random()<0.55){dmg+=2; note=" Clean angle."} else dmg=Math.max(1,dmg-3);}
  if(mode==="heal"){p.hp=Math.min(p.maxHp,p.hp+12); note=" You slam a healing ampoule."; dmg=0;}
  e.hp-=dmg;
  if(e.hp<=0){combatWin();return}
  let incoming=rnd(Math.max(1,e.atk-3),e.atk+3);
  if(mode==="stealth" && Math.random()<0.5) incoming=0;
  if(mode==="move" && Math.random()<0.35) incoming=Math.floor(incoming/2);
  p.hp-=incoming;
  if(p.hp<=0){gameOver();return}
  combatRender(`${dmg?`Your shot deals <b>${dmg}</b>.`:""}${note}<br>${e.name} hits back for <b>${incoming}</b>.`);
}
function combatWin(){
  const e=state.flags.currentCombat,p=state.player;
  const g=rnd(e.gold[0],e.gold[1]); p.gold+=g; gainXP(e.xp); p.viewers+=rnd(e.boss?15:3,e.boss?40:10);
  p.rank=Math.max(1,p.rank-rnd(1,e.boss?8:3));
  log(`☠️ Defeated ${e.name}. +${e.xp} XP, +${g} gold.`);
  if(e.boss) achievement("BOSS PROBLEM SOLVED","Your solution involved an arrow and very little committee review.");
  lootRoll(e.boss);
  const after=e.after; state.flags.currentCombat=null;
  setTimeout(()=>window[after](),100);
}

}
function enterLastShot(){
  scene(`<h2>🎥 Live Arena: The Last Shot</h2>
  <p>You enter a dark production block. Cameras wake one by one.</p>
  <p>An arrow is embedded in the wall beside you. A note is wrapped around the shaft:</p>
  <div class="achievement"><b>IF YOU'RE HERE TO KILL ME, MISS YOUR FIRST SHOT.</b></div>
  <p class="ai"><b>Dungeon AI:</b> Intrigue! Betrayal! Contractual ambiguity! This is why we have advertisers.</p>`,
  [
    {label:"Fire a deliberate miss",action:"crowTalk()",cls:"primary"},
    {label:"Take the killing shot",action:"crowFight()",cls:"bad"},
    {label:"Use Hot Mic and wait",action:"hotMicCrow()"}
  ]);
}
function crowTalk(){
  state.player.viewers+=30;
  achievement("MISSED ON PURPOSE","The audience thinks you screwed up. The smart viewers do not.");
  scene(`<h2>Crow Steps Out</h2>
  <p>Crow lowers his crossbow.</p>
  <p>“The producer feeding the hunters your route is Selene Vaar. She paid through an intermediary and used show telemetry to time hits.”</p>
  <p>Your sponsor channel stays silent. Good. Production still doesn't know what support you actually have.</p>`,
  [
    {label:"Secure Crow alive",action:"secureCrow()",cls:"good"},
    {label:"Ask for proof",action:"crowProof()"}
  ]);
}
function crowProof(){
  addItem("Raw Route Ledger","evidence","Mythic","Production route telemetry with authorization signatures.");
  state.player.fame+=4; secureCrow();
}
function hotMicCrow(){
  if(state.inventory.some(i=>i.name==="Hot Mic")){
    state.player.viewers+=40; achievement("HOT MIC DROP","You turned an assassination segment into discovery.");
    crowTalk();
  }else{
    scene(`<h2>No Hot Mic</h2><p>You pat your gear. Nothing.</p>`,[{label:"Deliberately miss instead",action:"crowTalk()"}]);
  }
}
function crowFight(){combatStart('glassJackal','secureCrow')}
function secureCrow(){
  state.player.floor=4;
  state.player.gold+=1000;
  state.systems.celestialBoxes++;
  achievement("PRODUCER'S NIGHTMARE","You satisfied the segment contract without delivering the murder they wanted.");
  scene(`<h2>Floor 3 Complete</h2>
  <p>Crow is alive. Quinn has the telemetry. Your sponsor has its secrets. The producer has a problem.</p>
  <p>A Celestial Box appears with the sound of a choir falling down stairs.</p>
  <p class="ai"><b>Dungeon AI:</b> Congratulations. You discovered the most dangerous weapon in the dungeon: documentation.</p>`,
  [
    {label:"Open the Celestial Box",action:"openCelestial()",cls:"gold"},
    {label:"Return to Safe Room",action:"safeHub()"}
  ]);
}
function openCelestial(){
  const rewards=[
    ["Starheart Core","Ascendant crafting core. Permanently upgrades one Ascendant relic."],
    ["Nightglass Anchor","After teleport or stealth reposition, leave a decoy that absorbs one attack."],
    ["The Ending","Single-use arrow. Ignores ordinary armor and barriers."]
  ];
  rewards.forEach(r=>addItem(r[0],"relic","Ascendant",r[1]));
  state.player.attack+=2;state.player.stealth+=1;state.player.gold+=800;
  scene(`<h2>✨ Celestial Box Opened</h2>
  <p>You receive a crafting core, a decoy relic, a single-use execution arrow, and 800 gold.</p>
  <p>Mordecai stares at the Starheart.</p>
  <p>“Do not spend that just because it's shiny.”</p>`,
  [
    {label:"Save the Starheart",action:"floorFourTease()",cls:"good"},
    {label:"Fuse it into Zero-Line Scope",action:"starheartFuse()",cls:"gold"}
  ]);
}
function starheartFuse(){
  state.player.crit+=4;state.player.attack+=3;
  log("✨ Starheart fused into Zero-Line Scope.");
  achievement("STARLINE","You upgraded the bow instead of exercising restraint. The audience approves.");
  floorFourTease();
}
function floorFourTease(){
  scene(`<h2>Floor 4 Awaits</h2>
  <p>The next floor has not been fully mapped. Gods are maneuvering. Clubs are recruiting. Crawler factions are consolidating. Your ratings are now dangerous.</p>
  <p>This build includes a complete playable arc through Floors 1–3 plus repeatable hubs, combat, loot, clubs, casino, gods, TV game shows, sponsor systems, achievements, rankings, party growth, hidden notes, crafting, and save/export support.</p>
  <p class="ai"><b>Dungeon AI:</b> The rest of your suffering can be expanded without changing the save format. You're welcome.</p>`,
  [
    {label:"Free-play the Safe Room systems",action:"safeHub()",cls:"primary"},
    {label:"Run a random broadcast event",action:"randomEvent()"}
  ]);
}
function randomEvent(){
  const events=["A fan box drops from nowhere.","A rival crawler challenges your rank.","A god demands a minor favor.","A producer offers a suspicious game show.","A merchant claims to sell a map that is 'mostly true.'"];
  const e=events[rnd(0,events.length-1)];
  state.player.viewers+=rnd(3,12); state.player.gold+=rnd(20,100);
  scene(`<h2>📡 Random Dungeon Event</h2><p>${e}</p><p>You gain a small amount of gold and audience attention.</p>`,
  [{label:"Another event",action:"randomEvent()"},{label:"Safe Room",action:"safeHub()"}]);
}
function saveGame(){
  localStorage.setItem("broadcastDungeonSave",JSON.stringify(state));
  log("💾 Game saved locally.");
}
function loadGame(){
  const raw=localStorage.getItem("broadcastDungeonSave");
  if(!raw){log("No local save found.");return}
  const s=JSON.parse(raw);
  Object.keys(state).forEach(k=>delete state[k]); Object.assign(state,s);
  log("📥 Save loaded."); safeHub();
}
function exportSave(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="broadcast-dungeon-save.json";a.click();URL.revokeObjectURL(a.href);
}
function resetGame(){
  localStorage.removeItem("broadcastDungeonSave"); location.reload();
}

update();
start();
</script>
</body>
</html>
